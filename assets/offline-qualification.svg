<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111e"/><stop offset="1" stop-color="#11213a"/></linearGradient><style>
    .title{font:700 34px system-ui,'Noto Sans SC';fill:#ecf6ff}.sub{font:500 18px system-ui,'Noto Sans SC';fill:#9db2c6}.label{font:600 20px system-ui,'Noto Sans SC';fill:#d9e8f5}.value{font:700 20px system-ui,'Noto Sans SC';fill:#ecf6ff}.axis{stroke:#36536c;stroke-width:2}.gate{stroke:#ffbf3f;stroke-width:2;stroke-dasharray:8 7}.recall{fill:#16d9d0}.precision{fill:#c46bff}.place{fill:#6fe09c}
  </style></defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="60" y="68" class="title">静态离线资格：Risk 与 Visual Place 双轨独立通过</text>
  <text x="60" y="105" class="sub">Risk 正式格指标；Visual Place 仅诊断，不获得定位接管或 visual-anchor 权限</text>

  <text x="60" y="165" class="label">Risk recall / precision</text>
  <line x1="270" y1="180" x2="270" y2="540" class="axis"/>
  <line x1="270" y1="540" x2="875" y2="540" class="axis"/>
  <line x1="754" y1="180" x2="754" y2="540" class="gate"/><text x="720" y="570" class="sub">80%</text>
  <line x1="814" y1="180" x2="814" y2="540" class="gate"/><text x="786" y="600" class="sub">90%</text>

  <text x="60" y="250" class="label">Development</text><rect x="270" y="215" width="595" height="28" rx="7" class="recall"/><rect x="270" y="255" width="567" height="28" rx="7" class="precision"/><text x="875" y="238" class="value">98.45%</text><text x="847" y="278" class="value">93.77%</text>
  <text x="60" y="370" class="label">Fresh Gate</text><rect x="270" y="335" width="595" height="28" rx="7" class="recall"/><rect x="270" y="375" width="567" height="28" rx="7" class="precision"/><text x="875" y="358" class="value">98.36%</text><text x="847" y="398" class="value">93.76%</text>
  <text x="60" y="490" class="label">Confirmation</text><rect x="270" y="455" width="596" height="28" rx="7" class="recall"/><rect x="270" y="495" width="568" height="28" rx="7" class="precision"/><text x="876" y="478" class="value">98.49%</text><text x="848" y="518" class="value">93.80%</text>

  <rect x="980" y="175" width="355" height="380" rx="20" fill="#0e2033" stroke="#2d5a4b" stroke-width="2"/>
  <text x="1015" y="225" class="label">Visual Place P95</text>
  <text x="1015" y="286" class="sub">Fresh Gate</text><text x="1015" y="335" class="value" style="font-size:42px">0.603 m</text>
  <text x="1015" y="405" class="sub">Confirmation</text><text x="1015" y="454" class="value" style="font-size:42px">0.595 m</text>
  <text x="1015" y="515" class="sub">门槛 ≤ 2.0 m · trusted 100%</text>

  <rect x="60" y="625" width="18" height="18" rx="4" class="recall"/><text x="90" y="641" class="sub">Recall</text><rect x="195" y="625" width="18" height="18" rx="4" class="precision"/><text x="225" y="641" class="sub">Precision</text><text x="420" y="641" class="sub">onset P95 0.2 s · clear P95 0.4 s · healthy coverage 100%</text>
</svg>
