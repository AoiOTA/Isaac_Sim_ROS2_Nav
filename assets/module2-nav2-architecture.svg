<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111e"/><stop offset="1" stop-color="#11213a"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#55d9d2"/></marker>
    <style>
      .title{font:700 34px system-ui,'Noto Sans SC';fill:#ecf6ff}.sub{font:500 20px system-ui,'Noto Sans SC';fill:#9db2c6}.head{font:700 24px system-ui,'Noto Sans SC';fill:#ecf6ff}.body{font:500 17px system-ui,'Noto Sans SC';fill:#c9d9e7}.box{fill:#0e2033;stroke:#294b67;stroke-width:2}.m2{stroke:#ffbf3f}.m3{stroke:#6fe09c}.safe{stroke:#55d896}.line{fill:none;stroke:#55d9d2;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#c46bff;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <text x="60" y="70" class="title">Attempt-21 static-only：Module2 接入 Module3 / Nav2</text>
  <text x="60" y="108" class="sub">Module2 增加可拒绝的软风险；传统 RGB-D 安全链与 Nav2 控制权保持不变</text>

  <rect x="55" y="175" width="230" height="150" rx="18" class="box"/>
  <text x="85" y="220" class="head">Isaac Sim RGB-D</text><text x="85" y="258" class="body">RGB + aligned depth</text><text x="85" y="288" class="body">intrinsics / extrinsics</text>

  <rect x="360" y="155" width="255" height="190" rx="18" class="box m2"/>
  <text x="392" y="202" class="head">Module2</text><text x="392" y="240" class="body">DINO tokens → RGB-D BEV</text><text x="392" y="270" class="body">32×32，0.5 m/cell</text><text x="392" y="300" class="body">risk + health + OOD</text>

  <rect x="690" y="175" width="245" height="150" rx="18" class="box"/>
  <text x="722" y="220" class="head">ROS Bridge</text><text x="722" y="258" class="body">LocalRiskGrid v1</text><text x="722" y="288" class="body">identity / TTL / reset</text>

  <rect x="1010" y="155" width="330" height="190" rx="18" class="box m3"/>
  <text x="1042" y="202" class="head">Module3 Global Costmap</text><text x="1042" y="240" class="body">authoritative TF projection</text><text x="1042" y="270" class="body">max merge，cost ≤ 80</text><text x="1042" y="300" class="body">invalid → clear next cycle</text>

  <path d="M285 250 H355" class="line"/><path d="M615 250 H685" class="line"/><path d="M935 250 H1005" class="dash"/>
  <text x="945" y="235" class="body" fill="#c46bff">Gate PASS</text>

  <rect x="55" y="450" width="230" height="150" rx="18" class="box safe"/>
  <text x="85" y="495" class="head">Depth PointCloud2</text><text x="85" y="533" class="body">建图后低矮障碍</text><text x="85" y="563" class="body">独立于 Module2</text>

  <rect x="360" y="430" width="255" height="190" rx="18" class="box safe"/>
  <text x="392" y="477" class="head">Nav2 VoxelLayer</text><text x="392" y="515" class="body">Local + Global</text><text x="392" y="545" class="body">绿色 5 cm marked voxels</text><text x="392" y="575" class="body">传统静态避障主链</text>

  <rect x="690" y="430" width="245" height="190" rx="18" class="box m3"/>
  <text x="722" y="477" class="head">Nav2 Planning</text><text x="722" y="515" class="body">Smac global planner</text><text x="722" y="545" class="body">MPPI local controller</text><text x="722" y="575" class="body">Local Costmap safety</text>

  <rect x="1010" y="430" width="330" height="190" rx="18" class="box m3"/>
  <text x="1042" y="477" class="head">Module3 最终控制</text><text x="1042" y="515" class="body">Collision Monitor /scan_safety</text><text x="1042" y="545" class="body">velocity smoother</text><text x="1042" y="575" class="body">唯一 /cmd_vel owner</text>

  <path d="M285 525 H355" class="line"/><path d="M615 525 H685" class="line"/><path d="M935 525 H1005" class="line"/>
  <path d="M1175 345 V425" class="dash"/>

  <text x="60" y="690" class="sub">黄色/红色 = Module2 prediction ｜ 紫色 = Module3 已应用软风险 ｜ 绿色 = 传统 RGB-D VoxelLayer ｜ 青色 = Motion Belief 诊断</text>
  <text x="60" y="727" class="sub">禁止边界：不清除真实障碍、不写 lethal、不进入 Local Costmap / Collision Monitor、不直接控制底盘</text>
</svg>
