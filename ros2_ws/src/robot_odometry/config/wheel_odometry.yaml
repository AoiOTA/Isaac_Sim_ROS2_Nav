wheel_odometry:
  ros__parameters:
    use_sim_time: true
    wheel_radius: 0.098
    # Odometry-side effective track width, calibrated offline against ground
    # truth (validation doc section 0.2, 2026-08-16): the controller-side
    # wheel_distance is 0.800, but measured in-place +360/-360 turns showed
    # the wheel odometry over-reading yaw by +2.6%/+3.1% (mean x1.0285), so
    # the odometry kinematics uses 0.800 x 1.0285 = 0.823 to cancel the
    # systematic yaw gain.  The controller keeps its own 0.800.
    track_width: 0.823
    left_joint_names:
      - front_left_wheel_joint
      - rear_left_wheel_joint
    right_joint_names:
      - front_right_wheel_joint
      - rear_right_wheel_joint
    publish_rate: 50.0
    max_integration_step: 0.25
    # Hold the last pose and inflate covariance x100 when no fresh
    # /joint_states sample arrives within this window (s); a STALE
    # diagnostic is published on /diagnostics while the stream is down.
    joint_state_timeout_s: 0.1
    # Same-side front/rear wheel speed spread above this (rad/s) is treated
    # as slip: covariance x10 plus a slip_detected diagnostic flag.
    # TODO: re-check against slip-scenario calibration data before tuning.
    same_side_diff_threshold_radps: 3.0
    # Left/right mean wheel speed difference above this (rad/s) counts as a
    # turn and inflates the yaw covariance by turn_yaw_covariance_scale.
    turn_diff_threshold_radps: 1.0
    turn_yaw_covariance_scale: 2.0
    odom_frame: odom
    base_frame: base_link
    pose_covariance_diagonal: [0.0025, 0.0025, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.0025, 1000000.0, 1000000.0, 1000000.0, 1000000.0, 0.01]

# Calibrated IMU yaw-rate relay: the IMU over-reads yaw rate by a
# systematic x1.085 gain against ground truth (validation doc section 0.2),
# so the EKF fuses this scaled stream instead of the raw /imu/data.
imu_yaw_scale:
  ros__parameters:
    yaw_rate_scale: 0.922
    yaw_rate_bias_radps: 0.0
    yaw_rate_covariance: 0.005
