rf2o_laser_odometry_node:
  ros__parameters:
    use_sim_time: true
    laser_scan_topic: /scan
    odom_topic: /lidar/odom
    publish_tf: false
    base_frame_id: base_link
    odom_frame_id: odom
    freq: 20.0
    init_pose_from_topic: ""
    # Conservative shadow-mode values pending dataset/Isaac calibration.
    # Order: x, y, z, roll, pitch, yaw.
    pose_covariance_diagonal: [0.05, 0.05, 1000000.0, 1000000.0, 1000000.0, 0.10]
    twist_covariance_diagonal: [0.10, 0.10, 1000000.0, 1000000.0, 1000000.0, 0.20]
