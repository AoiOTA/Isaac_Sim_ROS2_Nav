# This file documents the only supported TF ownership combinations.
modes:
  ideal_isaac:
    odometry_mode: ideal
    structure_tf_source: isaac
    odom_to_base_publisher: Isaac Sim
    structure_tf_publisher: Isaac Sim
  realistic_isaac:
    odometry_mode: realistic
    structure_tf_source: isaac
    odom_to_base_publisher: robot_localization
    structure_tf_publisher: Isaac Sim
  realistic_rsp:
    odometry_mode: realistic
    structure_tf_source: rsp
    odom_to_base_publisher: robot_localization
    structure_tf_publisher: robot_state_publisher

operations:
  mapping:
    slam_executable: async_slam_toolbox_node
    publishes_initialpose: false
    starts_nav2: false
  incremental_mapping:
    slam_executable: async_slam_toolbox_node
    posegraph_required: true
    publishes_initialpose: true
    starts_nav2: false
  localization:
    slam_executable: localization_slam_toolbox_node
    posegraph_required: true
    occupancy_map_required: true
    starts_nav2: false
  navigation:
    slam_executable: localization_slam_toolbox_node
    posegraph_required: true
    occupancy_map_required: true
    starts_nav2: true

# map->odom TF ownership per localization backend.  The odom->base_link
# owner rule documented in the modes above is unchanged: Isaac Sim (Isaac
# Compute Odometry) publishes it in ideal odometry mode, robot_localization
# (EKF) in realistic mode.  slam_toolbox still requires realistic odometry;
# ideal odometry may pair with the ideal backend or with amcl, where the
# localization_continuity_guard republishes the AMCL estimate as map->odom.
localization_backends:
  ideal:
    map_to_odom_publisher: ideal_localization_tf
    allowed_odometry_modes: [ideal]
    requires_occupancy_map: true
    requires_posegraph: true
  amcl:
    map_to_odom_publisher: localization_continuity_guard
    allowed_odometry_modes: [ideal, realistic]
    requires_occupancy_map: true
    requires_posegraph: false
  slam_toolbox:
    map_to_odom_publisher: slam_toolbox
    allowed_odometry_modes: [realistic]
    requires_occupancy_map: true
    requires_posegraph: true
