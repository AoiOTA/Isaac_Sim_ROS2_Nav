# This file documents the only supported TF ownership combinations.
modes:
  ideal_isaac:
    odometry_mode: ideal
    structure_tf_source: isaac
    odom_to_base_publisher: Isaac Sim
    map_to_odom_publisher: ideal_localization_tf
    structure_tf_publisher: Isaac Sim
  realistic_isaac:
    odometry_mode: realistic
    structure_tf_source: isaac
    odom_to_base_publisher: robot_localization
    map_to_odom_publisher: AMCL
    structure_tf_publisher: Isaac Sim
  realistic_rsp:
    odometry_mode: realistic
    structure_tf_source: rsp
    odom_to_base_publisher: robot_localization
    map_to_odom_publisher: AMCL
    structure_tf_publisher: robot_state_publisher
  estimated_isaac:
    odometry_mode: estimated
    structure_tf_source: isaac
    odom_to_base_publisher: robot_localization
    map_to_odom_publisher: AMCL
    structure_tf_publisher: Isaac Sim
  estimated_rsp:
    odometry_mode: estimated
    structure_tf_source: rsp
    odom_to_base_publisher: robot_localization
    map_to_odom_publisher: AMCL
    structure_tf_publisher: robot_state_publisher

operations:
  mapping:
    slam_executable: async_slam_toolbox_node
    publishes_initialpose: false
    starts_nav2: false
  incremental_mapping:
    slam_executable: async_slam_toolbox_node
    posegraph_required: true
    publishes_initialpose: true
    starts_nav2: false
  localization:
    localization_backend: amcl
    posegraph_required: true
    occupancy_map_required: true
    starts_nav2: false
  navigation:
    localization_backend: amcl
    posegraph_required: true
    occupancy_map_required: true
    starts_nav2: true

cognitive_profiles:
  M0:
    obstacle_layer_mode: 'off'
    risk_critic_mode: 'off'
    module2_enabled: false
  M1:
    obstacle_layer_mode: shadow
    risk_critic_mode: shadow
    module2_enabled: true
  M2:
    obstacle_layer_mode: active
    risk_critic_mode: 'off'
    module2_enabled: true
  M3:
    obstacle_layer_mode: active
    risk_critic_mode: active
    module2_enabled: true
