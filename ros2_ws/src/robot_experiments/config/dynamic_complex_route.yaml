schema_version: 1
scenario:
  id: dynamic_warehouse_complex_route
  type: dynamic
  spawn_pose_name: mapping_start
  map_version: warehouse_v1
  posegraph_version: warehouse_v1
  configs:
    robot: ../../../../isaac_sim/configs/robots/jackal.yaml
    nav2: ../../robot_navigation/config/nav2_params.yaml
    dynamic_obstacles: ../../../../isaac_sim/configs/experiments/dynamic_complex_route.yaml
  simulation:
    physics_dt: 0.0166666667
    rtf: 1.0
  runs:
    seeds: [6301, 6302, 6303]
    timeout_sec: 420.0
  goal:
    frame_id: map
    position: [0.0, 6.0]
    yaw_deg: 90.0
    require_orientation: true
  route:
    - {frame_id: map, position: [0.0, 8.0], yaw_deg: 90.0, require_orientation: true}
    - {frame_id: map, position: [5.0, 1.0], yaw_deg: 0.0, require_orientation: true}
    - {frame_id: map, position: [0.0, -7.0], yaw_deg: -90.0, require_orientation: true}
    - {frame_id: map, position: [-8.0, 0.0], yaw_deg: 180.0, require_orientation: true}
    - {frame_id: map, position: [-2.0, 5.0], yaw_deg: 90.0, require_orientation: true}
    - {frame_id: map, position: [0.0, 6.0], yaw_deg: 90.0, require_orientation: true}
  success:
    position_tolerance_m: 0.25
    orientation_tolerance_deg: 10.0
    final_linear_speed_mps: 0.02
    final_angular_speed_radps: 0.05
    final_still_duration_sec: 1.0
    final_still_timeout_sec: 10.0
    require_safety_observations: true
    minimum_ground_truth_path_length_m: 49.0
    minimum_reverse_distance_m: 0.0
    maximum_reverse_distance_fraction: 0.02
    minimum_curved_distance_fraction: 0.05
    maximum_stopped_time_fraction: 0.55
  obstacles:
    layout_id: four_repeating_crossings_complex_route_v1
    static: []
    trajectories:
      - id: crossing_east
        motion: crossing
        shape: box
        repeat: false
        dimensions: [0.5, 0.5]
        waypoints:
          - {time_sec: 0.0, position: [2.0, -4.5]}
          - {time_sec: 28.0, position: [2.0, 5.3]}
      - id: crossing_west
        motion: crossing
        shape: box
        repeat: false
        dimensions: [0.5, 0.5]
        waypoints:
          - {time_sec: 0.0, position: [-2.0, 5.8]}
          - {time_sec: 39.333333333, position: [-2.0, -6.0]}
      - id: oncoming_north
        motion: oncoming
        shape: box
        repeat: false
        dimensions: [0.8, 0.5]
        waypoints:
          - {time_sec: 0.0, position: [4.8, 1.0]}
          - {time_sec: 30.285714286, position: [-5.8, 1.0]}
      - id: oncoming_south
        motion: oncoming
        shape: box
        repeat: false
        dimensions: [0.8, 0.5]
        waypoints:
          - {time_sec: 0.0, position: [-5.3, -1.0]}
          - {time_sec: 33.666666667, position: [4.8, -1.0]}
