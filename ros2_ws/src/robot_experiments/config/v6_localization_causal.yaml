schema_version: bio_nav_v6_phase_de_localization_live_v1
phase_b_manifest: v6_r5_phase_b_kujiale_exact_baseline.yaml

held_constants:
  module2_navigation_write_enabled: false
  cognitive_place_graph_enabled: false
  low_obstacles_enabled: false
  dynamic_actors_enabled: false
  ground_truth_policy: passive_evaluator_only
  initial_pose_source: runner_or_supervisor_only

arms:
  S0: {phase: D, supervisor_mode: shadow, recovery: none}
  S1: {phase: D, supervisor_mode: startup, recovery: none}
  R0: {phase: E, supervisor_mode: shadow, recovery: global_localization}
  R1: {phase: E, supervisor_mode: active, recovery: supervisor_manual_rescue}

seeds: {S0: 8810, S1: 8810, R0: 8820, R1: 8820}

startup:
  # Frozen broad G1 seed. S1 is the sole arm that intentionally omits it.
  broad_initialpose:
    {x: 0.45, y: -5.35, yaw_deg: 90.0,
     xy_variance_m2: 1.0, yaw_variance_rad2: 0.2741556778}

route:
  goal_ids: [G2, G3, G4, G5, G1]

fault:
  id: F2
  leg_id: G3
  min_arc_length_m: 1.0
  stationary_hold_s: 1.0
  wrong_region_seed:
    {x: -2.20, y: -2.95, yaw_deg: -42.0,
     xy_variance_m2: 0.04, yaw_variance_rad2: 0.0304617420}

recovery:
  timeout_s: 45.0
  max_xy_variance_m2: 0.25
  max_yaw_variance_rad2: 0.5
