$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.invalid/robot_experiments/scenario.schema.yaml
title: Robot navigation experiment scenario
type: object
additionalProperties: false
required: [schema_version, scenario]
properties:
  schema_version:
    const: 1
  scenario:
    type: object
    additionalProperties: false
    required:
      - id
      - type
      - spawn_pose_name
      - map_version
      - posegraph_version
      - configs
      - simulation
      - runs
      - goal
      - success
      - obstacles
    properties:
      id: {type: string, minLength: 1}
      type: {enum: [static, dynamic, incremental]}
      spawn_pose_name: {type: string, minLength: 1}
      map_version: {type: string, minLength: 1}
      posegraph_version: {type: string, minLength: 1}
      configs:
        type: object
        additionalProperties: false
        required: [robot, nav2]
        properties:
          robot: {type: string, minLength: 1}
          nav2: {type: string, minLength: 1}
          dynamic_obstacles: {type: string, minLength: 1}
          appearance: {type: string, minLength: 1}
          optimal_reference: {type: string, minLength: 1}
      simulation:
        type: object
        additionalProperties: false
        required: [physics_dt, rtf]
        properties:
          physics_dt: {type: number, exclusiveMinimum: 0}
          rtf: {type: number, exclusiveMinimum: 0}
      runs:
        type: object
        additionalProperties: false
        required: [timeout_sec]
        oneOf:
          - required: [seeds]
          - required: [matrix]
        properties:
          seeds:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: integer, minimum: 0}
          matrix:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: [seed, case_id, variant_id]
              properties:
                seed: {type: integer, minimum: 0}
                case_id: {type: string, minLength: 1}
                variant_id: {type: string, minLength: 1}
                appearance_profile_id: {type: string, minLength: 1}
                condition_id: {type: string, minLength: 1}
          timeout_sec: {type: number, exclusiveMinimum: 0}
          leg_timeout_sec: {type: number, exclusiveMinimum: 0}
      goal:
        type: object
        additionalProperties: false
        required: [frame_id, position, yaw_deg, require_orientation]
        properties:
          id: {type: string, minLength: 1}
          frame_id: {const: map}
          position:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: number}
          yaw_deg: {type: number}
          require_orientation: {type: boolean}
      route:
        type: array
        minItems: 2
        items:
          type: object
          additionalProperties: false
          required: [frame_id, position, yaw_deg, require_orientation]
          properties:
            id: {type: string, minLength: 1}
            frame_id: {const: map}
            position:
              type: array
              minItems: 2
              maxItems: 2
              items: {type: number}
            yaw_deg: {type: number}
            require_orientation: {type: boolean}
      success:
        type: object
        additionalProperties: false
        required:
          - position_tolerance_m
          - orientation_tolerance_deg
          - final_linear_speed_mps
          - final_angular_speed_radps
          - final_still_duration_sec
          - final_still_timeout_sec
          - require_safety_observations
        properties:
          position_tolerance_m: {type: number, minimum: 0, maximum: 0.25}
          orientation_tolerance_deg: {type: number, minimum: 0, maximum: 10}
          final_linear_speed_mps: {type: number, minimum: 0}
          final_angular_speed_radps: {type: number, minimum: 0}
          final_still_duration_sec: {type: number, exclusiveMinimum: 0}
          final_still_timeout_sec: {type: number, exclusiveMinimum: 0}
          require_safety_observations: {type: boolean}
          minimum_ground_truth_path_length_m: {type: number, minimum: 0}
          minimum_reverse_distance_m: {type: number, minimum: 0}
          maximum_reverse_distance_fraction: {type: number, minimum: 0, maximum: 1}
          minimum_curved_distance_fraction: {type: number, minimum: 0, maximum: 1}
          maximum_stopped_time_fraction: {type: number, minimum: 0, maximum: 1}
          static_geometric_overlap_is_diagnostic_only: {type: boolean}
      obstacles:
        type: object
        additionalProperties: false
        required: [layout_id, static, trajectories]
        properties:
          layout_id: {type: string, minLength: 1}
          static:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: {type: string, minLength: 1}
          trajectories:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [id, motion, shape, repeat, dimensions, waypoints]
              properties:
                id: {type: string, minLength: 1}
                trigger_group: {type: [string, 'null'], minLength: 1}
                motion:
                  enum: [crossing, oncoming, same_direction_slow, local_bypass, temporary_block, g2_g3_exit, g5_g1_crossing, custom]
                shape: {const: box}
                repeat: {type: boolean}
                dimensions:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items: {type: number, exclusiveMinimum: 0}
                waypoints:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    additionalProperties: false
                    required: [time_sec, position]
                    properties:
                      time_sec: {type: number, minimum: 0}
                      position:
                        type: array
                        minItems: 2
                        maxItems: 2
                        items: {type: number}
      incremental_mapping:
        type: object
        additionalProperties: false
        required: [baseline_map_version, changed_regions, minimum_time_improvement_percent]
        properties:
          baseline_map_version: {type: string, minLength: 1}
          changed_regions: {type: array, minItems: 1}
          minimum_time_improvement_percent: {type: number, minimum: 30}
    allOf:
      - if:
          properties: {type: {const: dynamic}}
        then:
          properties:
            configs:
              required: [dynamic_obstacles]
            obstacles:
              properties:
                trajectories: {minItems: 1}
      - if:
          properties: {type: {enum: [static, incremental]}}
        then:
          properties:
            obstacles:
              properties:
                trajectories: {maxItems: 0}
      - if:
          properties: {type: {const: incremental}}
        then:
          required: [incremental_mapping]
