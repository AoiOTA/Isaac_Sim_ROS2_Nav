schema_version: 1
scenario:
  id: v6_pilot_kujiale_dynamic_hotreset_v1
  type: dynamic
  spawn_pose_name: long_route_start_g1
  map_version: v6_kujiale_isaacgen_v1
  posegraph_version: v6_kujiale_isaacgen_v1
  configs:
    robot: ../../../../isaac_sim/configs/robots/jackal.yaml
    nav2: ../../robot_navigation/config/nav2_dynamic_avoidance.yaml
    dynamic_obstacles: ../../../../isaac_sim/configs/experiments/v6_kujiale_dynamic_g2_crossing.yaml
  simulation: {physics_dt: 0.016666666666666666, rtf: 1.0}
  runs:
    matrix:
      - {seed: 8601, case_id: single_dynamic_g2_crossing, variant_id: v1, condition_id: dynamic_hotreset_cold}
      - {seed: 8601, case_id: single_dynamic_g2_crossing, variant_id: v1, condition_id: dynamic_hotreset_hot}
    timeout_sec: 600.0
    leg_timeout_sec: 180.0
  goal: {id: G1, frame_id: map, position: [0.45, -5.35], yaw_deg: 90.0, require_orientation: false}
  route:
    - {id: G2, frame_id: map, position: [0.80, 4.80], yaw_deg: -160.0, require_orientation: false}
    - {id: G3, frame_id: map, position: [-2.20, 3.25], yaw_deg: -105.0, require_orientation: false}
    - {id: G4, frame_id: map, position: [-3.00, -0.45], yaw_deg: -68.0, require_orientation: false}
    - {id: G5, frame_id: map, position: [-2.20, -2.95], yaw_deg: -42.0, require_orientation: false}
    - {id: G1, frame_id: map, position: [0.45, -5.35], yaw_deg: 90.0, require_orientation: false}
  success: {position_tolerance_m: 0.25, orientation_tolerance_deg: 10.0, final_linear_speed_mps: 0.02, final_angular_speed_radps: 0.05, final_still_duration_sec: 1.0, final_still_timeout_sec: 20.0, require_safety_observations: true, minimum_ground_truth_path_length_m: 20.0}
  obstacles:
    layout_id: kujiale_v6_dynamic_g2_crossing
    static: []
    trajectories:
      - id: v6_dynamic_g2_crossing_box
        trigger_group: G2
        motion: crossing
        shape: box
        repeat: false
        dimensions: [0.30, 0.30]
        waypoints:
          - {time_sec: 0.0, position: [-1.25, -0.35]}
          - {time_sec: 3.2, position: [-0.45, -0.35]}
