schema_version: 1
scenario:
  id: incremental_warehouse_operator_change
  type: incremental
  spawn_pose_name: mapping_start
  map_version: warehouse_v3_candidate
  posegraph_version: warehouse_v2
  configs:
    robot: ../../../../isaac_sim/configs/robots/jackal.yaml
    nav2: ../../robot_navigation/config/nav2_params.yaml
  simulation:
    physics_dt: 0.0166666667
    rtf: 1.0
  runs:
    seeds: [3301]
    timeout_sec: 180.0
