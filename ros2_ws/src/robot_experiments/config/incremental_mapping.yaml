  success:
    position_tolerance_m: 0.25
    orientation_tolerance_deg: 10.0
    final_linear_speed_mps: 0.02
    final_angular_speed_radps: 0.05
    final_still_duration_sec: 1.0
    final_still_timeout_sec: 10.0
    require_safety_observations: true
  obstacles:
    layout_id: warehouse_multiple_shelves_v1
    static: []
    trajectories: []
  incremental_mapping:
    baseline_map_version: warehouse_v2
    changed_regions: [operator_authored_change]
    minimum_time_improvement_percent: 30.0
