schema_version: 1
campaign_id: v6_estimated_calibration
repeats: 3
reset_seed_base: 6800
execution:
  reset_count_per_episode: 1
  retry_count: 0
  group_by_arm: true
  reuse_single_isaac_session: true
  reset_service: /simulation/reset
  readiness_topics: [/clock, /odom, /tf]
  dispatcher_topics: [/clock, /odom, /tf, /amcl_pose]
  passive_evaluator_topics: [/odom, /wheel/odom, /lidar/odom, /imu/data_raw, /imu/data, /amcl_pose, /ground_truth/odom]
  dispatcher_result_file: dispatcher_result.json
  dispatcher_success_status: SUCCEEDED
  collision_field: collision_detected
  rivermark_route_acceptance:
    canonical_route_topic: /bio_nav/canonical_route
    route_progress_topic: /bio_nav/route_progress
    acceptance_timeout_sec: 15.0
    resend_count: 0
    route_timeout_starts_after_acceptance: true
indoor_environment:
  environment_usd: /home/lyb/isaacsim_assets/Assets/Isaac/6.0/Isaac/Environments/Grid/default_environment.usd
  spawn_poses_file: /home/lyb/Workspace/Bio_Nav/worktrees/cognitive-navigation/bio_nav_module3/isaac_sim/configs/environments/v6_calibration_flat_20m.spawn.yaml
  spawn_pose_name: mapping_start
  map_yaml: /home/lyb/Workspace/Bio_Nav/worktrees/cognitive-navigation/bio_nav_module3/data/maps/v6_calibration_flat_20m.yaml
  static_obstacle_config: /home/lyb/Workspace/Bio_Nav/worktrees/cognitive-navigation/bio_nav_module3/isaac_sim/configs/experiments/v6_calibration_grid_features.yaml
  map_version: flat20_v1
supplement:
  revision: v6_estimated_calibration_flat20_supplement_r1
  exclusion_mapping:
    prior_narrow_indoor_calibration: excluded_environment_mismatch
    prior_primary_evidence: unchanged_not_reclassified
    rivermark_calibration_rows: unchanged_separate_environment
arms:
  - id: "off"
    launch_arguments:
      odometry_source: wheel_imu
      lidar_backend: "off"
      lidar_odom_validated: false
  - id: shadow
    launch_arguments:
      odometry_source: wheel_imu
      lidar_backend: rf2o
      lidar_odom_validated: false
  - id: fused
    requires_shadow_validation: true
    launch_arguments:
      odometry_source: wheel_imu_lidar
      lidar_backend: rf2o
      lidar_odom_validated: true
indoor_primitives:
  - id: straight_3m
    segments:
      - {duration_sec: 10.0, linear_x: 0.30, angular_z: 0.0}
  - id: ccw_360
    segments:
      - {duration_sec: 12.566, linear_x: 0.0, angular_z: 0.50}
  - id: cw_360
    segments:
      - {duration_sec: 12.566, linear_x: 0.0, angular_z: -0.50}
  - id: s_route
    segments:
      - {duration_sec: 2.5, linear_x: 0.25, angular_z: 0.45}
      - {duration_sec: 5.0, linear_x: 0.25, angular_z: -0.45}
      - {duration_sec: 2.5, linear_x: 0.25, angular_z: 0.45}
rivermark:
  id: rivermark_static_start_to_g1
  scenario: static
  start: static_start
  execution: nav2_route_goal
  wrapper: current_occupancy_only_estimated
  goal: {x: 1.521014, y: 131.813786, yaw_deg: 135.0}
thresholds:
  plan_reference:
    straight_3m: {maximum_longitudinal_error_m: 0.10, maximum_lateral_error_m: 0.10}
    rotation_360: {maximum_yaw_closure_deg: 5.0, maximum_position_error_m: 0.20}
    s_route: {maximum_aligned_ate_p95_m: 0.15, maximum_aligned_yaw_p95_deg: 5.0}
    rivermark: {maximum_amcl_absolute_ate_p95_m: 0.35, maximum_amcl_absolute_yaw_p95_deg: 8.0}
  engineering_recommendation:
    minimum_frequency_hz:
      odom: 30.0
      lidar_odom: 15.0
      amcl_pose: 1.0
    maximum_pose_step_m: 0.50
    maximum_yaw_step_deg: 30.0
    maximum_time_offset_ms: 100.0
    minimum_scale: 0.90
    maximum_scale: 1.10
    maximum_shadow_aligned_ate_p95_m: 0.15
    fused_improvement_fraction: 0.05
    fused_no_regression_fraction: 0.10
    covariance_coverage_is_diagnostic_only: true
