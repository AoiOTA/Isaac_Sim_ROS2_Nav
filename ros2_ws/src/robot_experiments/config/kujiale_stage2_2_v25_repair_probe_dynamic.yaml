# Two-record v25 physical-safety probe.  Actor contract stays identical to v4.
schema_version: 1
scenario:
  id: kujiale_stage2_2_v25_repair_probe_dynamic
  type: dynamic
  spawn_pose_name: long_route_start_g1
  map_version: warehouse_new
  posegraph_version: warehouse_new
  configs:
    robot: ../../../../isaac_sim/configs/robots/jackal.yaml
    nav2: ../../robot_navigation/config/nav2_params.yaml
    dynamic_obstacles: ../../../../isaac_sim/configs/experiments/kujiale_long_range_dynamic.yaml
    appearance: ../../../../isaac_sim/configs/experiments/kujiale_appearance_profiles.yaml
  simulation: {physics_dt: 0.016666666666666666, rtf: 1.0}
  runs:
    matrix:
      - {seed: 10507, case_id: full_route_three_stage, variant_id: v4, condition_id: dynamic_baseline, appearance_profile_id: baseline}
      - {seed: 10508, case_id: full_route_three_stage, variant_id: v4, condition_id: dynamic_appearance, appearance_profile_id: bright_cool}
    timeout_sec: 720.0
    leg_timeout_sec: 210.0
  goal: {frame_id: map, position: [0.45, -5.35], yaw_deg: 90.0, require_orientation: true}
  route:
    - {id: G2, frame_id: map, position: [0.80, 4.80], yaw_deg: -160.0, require_orientation: true}
    - {id: G3, frame_id: map, position: [-2.20, 3.25], yaw_deg: -105.0, require_orientation: true}
    - {id: G4, frame_id: map, position: [-3.00, -0.45], yaw_deg: -68.0, require_orientation: true}
    - {id: G5, frame_id: map, position: [-2.20, -2.95], yaw_deg: -42.0, require_orientation: true}
    - {id: G1, frame_id: map, position: [0.45, -5.35], yaw_deg: 90.0, require_orientation: true}
  success: {position_tolerance_m: 0.25, orientation_tolerance_deg: 10.0, final_linear_speed_mps: 0.02, final_angular_speed_radps: 0.05, final_still_duration_sec: 1.0, final_still_timeout_sec: 20.0, require_safety_observations: true, minimum_ground_truth_path_length_m: 20.0, minimum_reverse_distance_m: 0.0, maximum_reverse_distance_fraction: 1.0, minimum_curved_distance_fraction: 0.0, maximum_stopped_time_fraction: 1.0}
  obstacles:
    layout_id: kujiale_dynamic_avoidance_v4
    static: []
    trajectories:
      - {id: crossing_actor, trigger_group: G2, motion: crossing, shape: box, repeat: false, dimensions: [0.40, 0.40], waypoints: [{time_sec: 0.0, position: [0.70, 0.00]}, {time_sec: 4.2, position: [-1.20, 0.00]}]}
      - {id: oncoming_actor, trigger_group: G2, motion: oncoming, shape: box, repeat: false, dimensions: [0.40, 0.40], waypoints: [{time_sec: 0.0, position: [0.70, 0.80]}, {time_sec: 6.0, position: [-0.10, -1.20]}]}
      - {id: same_direction_slow_actor, trigger_group: G2, motion: same_direction_slow, shape: box, repeat: false, dimensions: [0.45, 0.45], waypoints: [{time_sec: 0.0, position: [-0.35, -0.10]}, {time_sec: 4.2, position: [-0.35, 0.65]}, {time_sec: 8.6, position: [0.45, 0.65]}, {time_sec: 15.3, position: [0.45, -0.55]}]}
      - {id: local_bypass_actor, trigger_group: G2, motion: local_bypass, shape: box, repeat: false, dimensions: [0.40, 0.40], waypoints: [{time_sec: 0.0, position: [-1.65, -0.20]}, {time_sec: 1.47, position: [-0.95, -0.20]}]}
      - {id: g2_g3_exit_actor, trigger_group: G3, motion: g2_g3_exit, shape: box, repeat: false, dimensions: [0.40, 0.40], waypoints: [{time_sec: 0.0, position: [-0.40, 1.00]}, {time_sec: 4.11, position: [-0.40, -0.70]}]}
      - {id: g5_g1_crossing_actor, trigger_group: G1, motion: g5_g1_crossing, shape: box, repeat: false, dimensions: [0.40, 0.40], waypoints: [{time_sec: 0.0, position: [-0.90, -1.30]}, {time_sec: 1.47, position: [-0.20, -1.30]}]}
      - {id: temporary_block_actor, trigger_group: G2, motion: temporary_block, shape: box, repeat: false, dimensions: [0.40, 0.40], waypoints: [{time_sec: 0.0, position: [0.95, 0.15]}, {time_sec: 5.0, position: [0.95, 0.15]}]}
