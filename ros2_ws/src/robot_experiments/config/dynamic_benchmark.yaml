          - {time_sec: 11.25, position: [2.0, 6.0]}
      - id: cart_proxy_b
        motion: oncoming
        shape: box
        repeat: false
        dimensions: [0.8, 0.5]
        waypoints:
          - {time_sec: 0.0, position: [4.0, 1.8]}
          - {time_sec: 10.0, position: [-2.0, 1.8]}
