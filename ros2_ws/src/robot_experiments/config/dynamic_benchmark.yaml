schema_version: 1
scenario:
  id: dynamic_warehouse_long_benchmark
  type: dynamic
  spawn_pose_name: mapping_start
  map_version: warehouse_v2
  posegraph_version: warehouse_v2
  configs:
    robot: ../../../../isaac_sim/configs/robots/jackal.yaml
    nav2: ../../robot_navigation/config/nav2_params.yaml
    dynamic_obstacles: ../../../../isaac_sim/configs/experiments/dynamic_benchmark.yaml
  simulation:
    physics_dt: 0.0166666667
    rtf: 1.0
  runs:
    seeds:
      - 5101
      - 5102
      - 5103
      - 5104
      - 5105
      - 5106
      - 5107
      - 5108
      - 5109
      - 5110
      - 5111
      - 5112
      - 5113
      - 5114
      - 5115
      - 5116
      - 5117
