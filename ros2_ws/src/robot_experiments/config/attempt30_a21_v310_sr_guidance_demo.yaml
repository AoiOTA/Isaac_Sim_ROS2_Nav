# V3.10 engineering-only SR causal demo on two existing physical GVG routes.
schema_version: 1
scenario:
  id: attempt30_a21_v310_sr_guidance_demo
  type: static
  spawn_pose_name: long_route_start_g2
  map_version: warehouse_new
  posegraph_version: warehouse_new
  configs:
    robot: ../../../../isaac_sim/configs/robots/jackal.yaml
    nav2: ../../robot_navigation/config/nav2_params.yaml
    dynamic_obstacles: ../../../../isaac_sim/configs/experiments/attempt30_a21_sr_guidance_static.yaml
  simulation: {physics_dt: 0.016666666666666666, rtf: 1.0}
  runs:
    matrix:
      - {seed: 8531, case_id: sr_guidance, variant_id: real_gvg_38_to_11, condition_id: engineering_sr_demo}
    timeout_sec: 240.0
    leg_timeout_sec: 180.0
  goal: {frame_id: map, position: [0.885, 4.705], yaw_deg: -160.0, require_orientation: true}
  route:
    - {id: WARMUP_NODE_48, frame_id: map, position: [2.085, 4.905], yaw_deg: 0.0, require_orientation: false}
    - {id: G2_AFTER_WARMUP, frame_id: map, position: [0.885, 4.705], yaw_deg: 0.0, require_orientation: false}
    - {id: SR_GOAL_NODE_11, frame_id: map, position: [-1.865, -0.345], yaw_deg: 0.0, require_orientation: false}
    - {id: G2_RETURN, frame_id: map, position: [0.885, 4.705], yaw_deg: -160.0, require_orientation: true}
  success:
    position_tolerance_m: 0.25
    orientation_tolerance_deg: 10.0
    final_linear_speed_mps: 0.02
    final_angular_speed_radps: 0.05
    final_still_duration_sec: 1.0
    final_still_timeout_sec: 20.0
    require_safety_observations: true
    minimum_ground_truth_path_length_m: 10.0
    minimum_reverse_distance_m: 0.0
    maximum_reverse_distance_fraction: 1.0
    minimum_curved_distance_fraction: 0.0
    maximum_stopped_time_fraction: 1.0
  obstacles:
    # This causal query isolates the two warehouse corridors already present
    # in the frozen physical GVG. The 4x20 obstacle layout is qualified by the
    # separate main campaign and would occlude the alternative corridor here.
    layout_id: warehouse_base_real_gvg_multi_route
    static:
      - {id: rgbd_low_box_west}
      - {id: rgbd_low_box_center}
      - {id: rgbd_low_box_east}
      - {id: rgbd_low_box_north}
      - {id: rgbd_low_bar_east}
      - {id: rgbd_low_bar_north}
    trajectories: []
