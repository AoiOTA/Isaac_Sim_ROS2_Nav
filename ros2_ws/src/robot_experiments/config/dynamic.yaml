schema_version: 1
scenario:
  id: dynamic_crossing_baseline
  type: dynamic
  spawn_pose_name: mapping_start
  map_version: warehouse_v1
  posegraph_version: warehouse_v1
  configs:
    robot: ../../../../isaac_sim/configs/robots/jackal.yaml
    nav2: ../../robot_navigation/config/nav2_params.yaml
    dynamic_obstacles: ../../../../isaac_sim/configs/experiments/dynamic.yaml
  simulation:
    physics_dt: 0.0166666667
    rtf: 1.0
  runs:
    seeds: [2201, 2202, 2203, 2204]
    timeout_sec: 90.0
  goal:
    frame_id: map
    position: [3.0, 0.0]
    yaw_deg: 0.0
    require_orientation: true
  success:
    position_tolerance_m: 0.25
    orientation_tolerance_deg: 10.0
    final_linear_speed_mps: 0.02
    final_angular_speed_radps: 0.05
    final_still_duration_sec: 1.0
    final_still_timeout_sec: 10.0
    require_safety_observations: true
  obstacles:
    layout_id: crossing_a
    static: []
    trajectories:
      - id: crossing_box
        motion: crossing
        shape: box
        repeat: false
        dimensions: [0.5, 0.5]
        waypoints:
          - {time_sec: 0.0, position: [2.0, -3.0]}
          - {time_sec: 15.0, position: [2.0, 3.0]}
      - id: cart_proxy_b
        motion: oncoming
        shape: box
        repeat: false
        dimensions: [0.8, 0.5]
        waypoints:
          - {time_sec: 0.0, position: [4.0, 1.8]}
          - {time_sec: 10.0, position: [1.0, 1.8]}
