amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    tf_broadcast: true
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field_prob
    min_particles: 1000
    max_particles: 6000
    max_beams: 120
    update_min_d: 0.15
    update_min_a: 0.12
    alpha1: 0.25
    alpha2: 0.25
    alpha3: 0.30
    alpha4: 0.30
    alpha5: 0.10
    do_beamskip: true
    beam_skip_distance: 0.7
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    laser_likelihood_max_dist: 3.0
    laser_max_range: 100.0
    laser_min_range: 0.40
    laser_sigma_hit: 0.25
    laser_z_hit: 0.90
    laser_z_rand: 0.10
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    save_pose_rate: 0.5
    transform_tolerance: 0.5
