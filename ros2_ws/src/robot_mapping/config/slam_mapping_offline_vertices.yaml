slam_toolbox:
  ros__parameters:
    use_sim_time: true
    solver_plugin: robot_slam_solver::ConfigurableCeresSolver
    ceres_num_threads: 12
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    # Piggyback mapping alongside a navigation stack: the navigation
    # localization owns map->odom, so this node maps in its own slam_map
    # frame.  Karto poses are frame-name agnostic; the serialized pose graph
    # is later loaded with map_frame:=map for localization.
    map_frame: slam_map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    use_map_saver: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.40
    max_laser_range: 25.0
    minimum_time_interval: 0.10
    transform_timeout: 0.20
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # Offline vertex-building profile: run with Ideal (Isaac Compute)
    # odometry.  Scan matching stays ON so the serialized pose graph contains
    # real graph vertices/edges - the use_scan_matching=false Ideal mapping
    # profile produces a vertex-less scan archive that crashes
    # localization_slam_toolbox_node on its first scan
    # (karto::MapperGraph::LinkChainToScan on an empty running-scans chain).
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.20
    minimum_travel_heading: 0.20
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.10
    link_scan_maximum_distance: 1.50
    loop_search_maximum_distance: 3.0
    # Loop closure stays OFF: the warehouse has several long, nearly
    # symmetric corridors and Ideal odometry needs no global correction.
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
