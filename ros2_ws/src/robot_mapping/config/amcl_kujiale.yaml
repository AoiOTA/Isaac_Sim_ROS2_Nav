amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    tf_broadcast: true
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field_prob
    min_particles: 500
    max_particles: 3000
    # V6 R5 round-1 bounded drift tuning (2026-08-22): the live run#2 G2->G3
    # door-zone collision came from AMCL drift of 0.24--0.25 m at contact,
    # above the 0.125 m margin the door geometry can absorb (run#1 drift
    # <=0.1 m passed the same leg).  Raise observation/update frequency on
    # the safe monotonic direction only: more beams per update and smaller
    # motion thresholds so filter updates fire more often in corridors.
    # alpha1-4, the laser model and the particle counts stay untouched until
    # the next evidence round.
    # Evidence: /mnt/nas_home/Bio_Nav_Data/experiments/analysis/v6_r5_margin_rootcause_20260822/
    max_beams: 120
    update_min_d: 0.05
    update_min_a: 0.05
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.10
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: 0.40
    laser_sigma_hit: 0.20
    laser_z_hit: 0.95
    laser_z_rand: 0.05
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    save_pose_rate: 0.5
    transform_tolerance: 0.5
