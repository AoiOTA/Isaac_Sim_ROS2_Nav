ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.10
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.05
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false
    reset_on_time_jump: true
    predict_to_current_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /wheel/odom
    # State vector order:
    # x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    # Calibration against ground truth (validation doc section 0.2) disproved
    # the earlier scrub-bias assumption: wheel yaw rate reads only +2.6%
    # high on 360-degree turns while the IMU yaw rate reads +8.4% high, so
    # the wheel differential is the better yaw source in this simulation.
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    imu0: /imu/data
    # IMU yaw rate is disabled: ground-truth calibration (section 0.2)
    # measured it reading +8.4% high on 360-degree turns versus +2.6% for
    # the wheel differential fused above.  No other IMU channel is consumed.
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
