# Attempt-23 static-scene local stack: the proven static (stable) MPPI budget
# plus the read-only reachability observer layer for the Integration sidecar.
#
# The aggressive dynamic envelope used for the dynamic Shadow segment brushes
# and can physically contact the 16 cm low obstacles on the tight static
# route (seed 31614 hit rgbd_low_bar_north on the ContactSensor).  The static
# scene has no dynamic actors, so the gentler verified static budget is the
# correct local stack here; every experiment arm shares it, preserving the
# causal attribution.  The reachability observer sits after all
# obstacle-marking layers and before inflation, and publishes a read-only
# snapshot; it does not modify the Nav2 costmap and does not authorize
# Module2 guidance.
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    FollowPath:
      time_steps: 20
      model_dt: 0.10
      batch_size: 700
      # Amendment 06 (paired A/B static segment, seed 31801): the narrow
      # rgbd_low gaps on this route leave ~2 cm of geometric clearance at the
      # tracked line, so contact is decided by sub-cm lateral/yaw wobble
      # during traversal (A1 passed 1/3 attempts, A10 0/12 with SAT overlaps
      # of 0.1 mm--2.6 cm).  Capping the forward envelope at 0.50 m/s halves
      # the per-step travel of the 10 Hz controller (7.5 -> 5 cm) and gives
      # MPPI more correction cycles per metre inside the gap.  This knob was
      # preferred over raising CostCritic cost_weight because two of the
      # A10 failures were already no-contact wedged timeouts, and the base
      # configuration documents crawl/alternating regressions from a higher
      # soft-obstacle weight in exactly these corridors.
      vx_max: 0.50
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic

global_costmap:
  global_costmap:
    ros__parameters:
      plugins:
        - static_layer
        - obstacle_layer
        - depth_voxel_layer
        - reachability_observer_layer
        - inflation_layer
      reachability_observer_layer:
        plugin: bio_nav_fusion::ReachabilityObserverLayer
        enabled: true
        output_topic: /global_costmap/reachability_observer_input

planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased:
      # The Module3 global planner remains the stock SmacPlanner2D.
      plugin: nav2_smac_planner::SmacPlanner2D

velocity_smoother:
  ros__parameters:
    # Match the amendment-06 MPPI forward cap so the smoother does not pass
    # commands the controller no longer generates (angular limits unchanged).
    max_velocity: [0.50, 0.0, 1.35]
