# Estimated-localization (wheel odometry + EKF + AMCL) dynamic profile.
#
# Clone of the nav2_dynamic_avoidance.yaml perception stack (STVL depth
# policy, LiDAR-only global clearing, footprint-checked recovery) plus the
# D1 clearance economics for the estimated chain: the AMCL pose carries
# ~0.15 m p95 error (engineering_defaults.yaml estimated_localization), so
# the global planner softens its obstacle cost decay to prefer wider
# corridors.
#
# D2': inflation_radius 0.40 -> 0.30 m on both costmaps (user-authorized
# for the estimated chain only, 2026-08-17; see nav2_estimated_static.yaml
# header for the smoke evidence).  nav2_params.yaml keeps the frozen
# 0.40 m; StopZone/footprint safety shells are untouched.
#
# The generated A21 overlay in navigation.launch.py outranks this file for
# GridBased.cost_travel_multiplier and FollowPath.PathFollowCritic; with
# localization_backend=amcl that overlay already emits the matching D1
# values (2.0 / 5.0) from its ESTIMATED_* constants, so they are not
# repeated here.

controller_server:
  ros__parameters:
    # Profiles must declare a complete MPPI timing tuple for the pre-launch
    # Jazzy timing contract; keep the validated base timing budget.
    controller_frequency: 10.0
    FollowPath:
      time_steps: 20
      model_dt: 0.10
      batch_size: 700
    progress_checker:
      # D3: double the patience so slow seam threading (estimated chain
      # runs a reduced velocity envelope) is not declared stuck early.
      movement_time_allowance: 40.0

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: [obstacle_layer, depth_stvl_layer, inflation_layer]
      inflation_layer:
        # D2' (user-authorized): narrower soft halo for seam passages.
        inflation_radius: 0.30
      obstacle_layer:
        scan:
          raytrace_min_range: 0.05
          inf_is_valid: false
      depth_stvl_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 0.75
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.10
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: camera_depth_mark camera_depth_clear
        camera_depth_mark:
          data_type: PointCloud2
          topic: /camera/front/depth/points
          marking: true
          clearing: false
          obstacle_range: 2.0
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: voxel
          voxel_min_points: 0
          clear_after_reading: true
        camera_depth_clear:
          data_type: PointCloud2
          topic: /camera/front/depth/points
          marking: false
          clearing: true
          min_z: 0.05
          max_z: 2.5
          vertical_fov_angle: 1.272
          horizontal_fov_angle: 1.839
          decay_acceleration: 15.0
          model_type: 0
global_costmap:
  global_costmap:
    ros__parameters:
      # Keep dynamic RGB-D local; the global planner uses the static map
      # plus independently clearing LiDAR observations.
      plugins: [static_layer, obstacle_layer, inflation_layer]
      obstacle_layer:
        scan:
          raytrace_min_range: 0.40
          inf_is_valid: false
      inflation_layer:
        # D1: soften the global obstacle cost decay (base 9.0) so the Smac
        # global planner prefers wider corridors under AMCL pose error.
        cost_scaling_factor: 6.0
        # D2' (user-authorized): see the header comment.
        inflation_radius: 0.30

behavior_server:
  ros__parameters:
    # Same dynamic-run contract as nav2_dynamic_avoidance.yaml: never issue
    # the shared dead-end-recovery BackUp without a costmap footprint check.
    simulate_ahead_time: 1.0
