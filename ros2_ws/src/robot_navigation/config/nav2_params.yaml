bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0

    navigators: [navigate_to_pose, navigate_through_poses]

    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator


controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    controller_frequency: 10.0
    costmap_update_timeout: 0.30

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3
    odom_topic: /odom

    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    # 允许纯旋转也被认为取得进展。
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.15
      movement_time_allowance: 20.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # Avoid declaring success while the chassis is still visibly short of
      # the requested pose.  The experiment gate independently checks
      # Ground Truth at 0.25 m / 10 deg, so Nav2 must converge more tightly
      # than that external acceptance envelope.
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.174532925

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController

      # 20 × 0.10 = 2 秒预测范围。
      time_steps: 20
      model_dt: 0.10
      # 保留 2 秒预测窗，用 500 samples 避免与 Ceres 定位争抢控制周期。
      batch_size: 500
      iteration_count: 1

      # Permit a small reverse sample near tight terminal poses.  This lets
      # MPPI re-centres at the G1 return point after a dynamic interaction instead of remaining
      # a few centimetres outside the acceptance circle until timeout.
      # Stable, fixed-noise sampling reduces small left/right corrections in
      # the wide parts of the house while retaining enough spread to detour
      # around a newly marked RGB-D low box.
      vx_std: 0.30
      vy_std: 0.00
      wz_std: 0.65

      # Forward motion remains strongly preferred, but a bounded reverse
      # sample is available for terminal-pose recovery in narrow rooms.
      vx_max: 0.75
      vx_min: -0.15
      vy_max: 0.00
      wz_max: 1.20

      ax_max: 1.10
      ax_min: -1.00
      ay_max: 0.00
      ay_min: 0.00
      az_max: 3.00

      prune_distance: 1.50
      transform_tolerance: 0.50

      temperature: 0.35
      gamma: 0.015

      motion_model: DiffDrive
      # Publish both /optimal_trajectory and /trajectories so the controller's
      # selected path and sampled candidates can be inspected live in RViz.
      visualize: true
      regenerate_noises: false

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        # The rectangular footprint remains collision-checked at every
        # prediction point.  A lower soft-cost weight lets valid trajectories
        # traverse the centre of narrow, symmetrically inflated corridors.
        cost_weight: 2.00
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 1

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.6

      # 窄通道内膨胀代价占比天然较高，仍保持 PathAlign 工作以避免左右摆动。
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Balance centring against forward progress.  An overly dominant
        # alignment score rewards slow samples in narrow corridors.
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.40
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 8
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        # Reward useful progress along the path instead of allowing a
        # well-aligned but persistently slow trajectory to dominate.
        cost_weight: 9.0
        offset_from_furthest: 10
        threshold_to_consider: 1.4

      # 大角度偏差时尽早修正朝向；正常导航明确以前进为主。
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 9.5
        offset_from_furthest: 8
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.45
        mode: 0

      # 与路径角度 critic 协同强化前进路径选择。恢复行为可短距离倒车，
      # 但正常 MPPI 路径跟踪不生成负线速度。
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # Reverse remains available only when a terminal pose genuinely needs
        # it.  A strong prior prevents low-box avoidance from oscillating
        # between forward and reverse samples in the open S→G1 area.
        cost_weight: 35.0
        threshold_to_consider: 0.5


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 10.0
      publish_frequency: 5.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      # The footprint already matches the physical wheel envelope. Keep a
      # small numerical shell without consuming a narrow doorway twice.
      footprint_padding: 0.005

      plugins: [obstacle_layer, depth_voxel_layer, inflation_layer]

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        combination_method: 1
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 0.50

          clearing: true
          marking: true
          data_type: LaserScan

          raytrace_max_range: 25.0
          raytrace_min_range: 0.40
          obstacle_max_range: 25.0
          obstacle_min_range: 0.40

      # Keep RGB-D observations in an independent layer. This prevents the
      # LiDAR clearing rays from clearing low obstacles marked by the camera.
      depth_voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        publish_voxel_map: true
        tf_filter_tolerance: 0.10

        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        max_obstacle_height: 0.50

        # Costmap2D observation_sources is declared as a string in Nav2 Jazzy;
        # multiple sources, when needed, are separated by spaces.
        observation_sources: camera_depth

        camera_depth:
          topic: /camera/front/depth/points
          sensor_frame: camera_front_optical_frame
          data_type: PointCloud2
          transport_type: raw
          marking: true
          # The camera sees the floor and the far side of the low box in the
          # same frame.  Ray-clearing those returns can immediately erase the
          # shallow box mark before the local planner consumes it.  Keep RGB-D
          # as a marking-only source; reset explicitly clears this layer and
          # the bounded persistence below expires stale observations.
          clearing: false
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          obstacle_min_range: 0.05
          obstacle_max_range: 2.0
          raytrace_min_range: 0.05
          raytrace_max_range: 2.5
          # A low box can leave the front camera FOV while the controller is
          # turning around it.  Keep a recent RGB-D marking long enough for
          # the local planner to complete that avoidance manoeuvre; regular
          # depth clearing still removes it after this bounded interval.
          observation_persistence: 1.0
          expected_update_rate: 0.0
          inf_is_valid: false

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 0.40 m remains above the padded 0.337 m circumscribed radius.  The
        # steeper decay preserves collision checking while allowing the MPPI
        # controller to use valid corridor-centre cells.
        cost_scaling_factor: 8.0
        inflation_radius: 0.40

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05
      track_unknown_space: true

      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      footprint_padding: 0.005

      # The low RGB-D-only box must also reach the global planner.  Otherwise
      # the local controller sees a collision while the global path keeps
      # commanding it straight through the obstacle, which ends in a safety
      # stop instead of a valid bypass.
      plugins: [static_layer, obstacle_layer, depth_voxel_layer, inflation_layer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 0.50

          clearing: true
          marking: true
          data_type: LaserScan

          raytrace_max_range: 25.0
          raytrace_min_range: 0.40
          obstacle_max_range: 25.0
          obstacle_min_range: 0.40

      depth_voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        publish_voxel_map: true
        tf_filter_tolerance: 0.10

        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        max_obstacle_height: 0.50
        observation_sources: camera_depth

        camera_depth:
          topic: /camera/front/depth/points
          sensor_frame: camera_front_optical_frame
          data_type: PointCloud2
          transport_type: raw
          marking: true
          # Global observations must still ray-clear.  A permanent global
          # depth history eventually turns unrelated furniture observations
          # into stale walls at later waypoints.
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          obstacle_min_range: 0.05
          obstacle_max_range: 2.0
          raytrace_min_range: 0.05
          raytrace_max_range: 2.5
          observation_persistence: 1.0
          expected_update_rate: 0.0
          inf_is_valid: false

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 8.0
        inflation_radius: 0.40

      always_send_full_costmap: true


planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0

    planner_plugins: [GridBased]

    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D

      # Keep the planner's substitute-goal radius inside the Goal Checker's
      # 0.20 m acceptance radius. Otherwise an invalid RViz goal can produce a
      # valid path that the controller can never finish.
      tolerance: 0.10
      downsample_costmap: false
      allow_unknown: true

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0

      # Keep a preference for open space, but do not reject the only valid
      # route merely because both walls inflate the corridor centreline.
      cost_travel_multiplier: 1.2
      use_final_approach_orientation: false

      smoother:
        max_iterations: 1000
        w_smooth: 0.30
        w_data: 0.20
        tolerance: 0.0000000001
        do_refinement: true


behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw

    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins: [spin, backup, drive_on_heading, wait]

    spin:
      plugin: nav2_behaviors::Spin

    backup:
      plugin: nav2_behaviors::BackUp

    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading

    wait:
      plugin: nav2_behaviors::Wait

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

    transform_tolerance: 0.10
    # In a narrow cul-de-sac the local costmap can report the robot's current
    # rectangular footprint as occupied even though manual reverse is clear.
    # Any positive value makes BackUp test that already-occupied start pose and
    # abort immediately with COLLISION_AHEAD. Disable this duplicate costmap
    # rollout for recovery behaviors; /collision_monitor still applies the
    # live lidar StopZone, ApproachZone and command hard-stop to every reverse
    # velocity sent to the robot.
    simulate_ahead_time: 0.0

    max_rotational_vel: 1.0
    min_rotational_vel: 0.12
    rotational_acc_lim: 3.0


velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false

    # 线速度受到限制时，按比例保留角速度，避免转弯曲率被破坏。
    scale_velocities: true

    feedback: OPEN_LOOP

    max_velocity: [0.75, 0.0, 1.20]
    # MPPI仍以 vx_min=0 前进跟踪；这里单独允许行为树 BackUp 的有限负速，
    # 否则 -0.18 m/s 恢复命令会被平滑器钳成零而无法离开死胡同。
    min_velocity: [-0.25, 0.0, -1.20]

    max_accel: [1.10, 0.0, 3.00]
    max_decel: [-1.00, 0.0, -3.00]

    odom_topic: /odom
    odom_duration: 0.10

    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50


collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    base_frame_id: base_link
    odom_frame_id: odom

    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: /collision_monitor_state

    transform_tolerance: 0.20
    # Monitoring-camera benchmark: Scan P99 age 0.182 s. This permits two
    # missing 10 Hz frames plus 0.10 s scheduling margin, while a sustained
    # outage still stops the command chain within 0.40 s.
    source_timeout: 0.40
    base_shift_correction: true
    stop_pub_timeout: 1.0

    polygons: [StopZone, SlowdownZone, ApproachZone]

    StopZone:
      type: polygon
      # Physical footprint is x=[-0.230, 0.255], y=+/-0.210 m.  This zone keeps
      # a 20--30 mm emergency shell, rather than the former 60 mm lateral shell
      # that was continuously triggered by parallel walls in narrow passages.
      points: "[[0.285, 0.230], [0.285, -0.230], [-0.250, -0.230], [-0.250, 0.230]]"

      action_type: stop
      min_points: 3

      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true

    SlowdownZone:
      type: polygon
      # Keep a useful warning shell around StopZone without continuously
      # catching parallel walls in a valid narrow corridor.  The physical
      # footprint is y=+/-0.210 m and the emergency shell is y=+/-0.230 m.
      points: "[[0.36, 0.235], [0.36, -0.235], [-0.30, -0.235], [-0.30, 0.235]]"

      action_type: slowdown
      min_points: 5
      # Preserve steering authority and forward progress when slowdown is
      # genuinely required; StopZone still provides the final hard stop.
      slowdown_ratio: 0.90

      visualize: true
      polygon_pub_topic: /collision_monitor/slowdown_zone
      enabled: true

    ApproachZone:
      type: polygon
      action_type: approach

      footprint_topic: /local_costmap/published_footprint

      # MPPI already collision-checks the complete footprint against both
      # costmap layers.  In narrow passages this predictive action repeatedly
      # rescales commands as individual LiDAR returns vary; SlowdownZone and
      # StopZone remain the final LiDAR safety layers.
      time_before_collision: 1.00
      simulation_time_step: 0.10
      min_points: 3

      visualize: false
      enabled: false

    # The low RGB-D test box is below the LiDAR plane.  Feed the same depth
    # cloud that marks the VoxelLayer into the last-resort safety monitor, so
    # an unmodelled local-costmap gap cannot become a physical contact.
    # RGB-D is fused into both costmaps; keep Collision Monitor's hard stop on
    # LiDAR only so ordinary near-field depth returns cannot deadlock a valid
    # doorway traversal.  Physical contact remains an independent verdict.
    observation_sources: [scan]

    scan:
      type: scan
      topic: /scan
      enabled: true

    camera_depth:
      type: pointcloud
      topic: /camera/front/depth/points
      min_height: 0.05
      max_height: 0.50
      enabled: true
