bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # BehaviorTree action acknowledgement timeout, in milliseconds. Isaac's
    # accelerated simulation can make Nav2 component callbacks exceed the
    # upstream 20 ms default during the first goal.
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    # Benchmarked with Isaac Sim 6.0.1 in headless Ideal mode. At 20 Hz the
    # controller repeatedly missed its deadline; 10 Hz completed the same
    # three-metre goal without a missed-control warning.
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odom
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.30
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # Leave margin beneath the 0.25 m Ground Truth acceptance threshold for
      # localization error between Nav2's estimated pose and evaluation pose.
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.174532925
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      # Keep a two-second prediction horizon while reducing the per-cycle
      # sampling cost enough for a stable 10 Hz control loop.
      time_steps: 20
      model_dt: 0.10
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.20
      vy_std: 0.00
      wz_std: 0.40
      vx_max: 1.00
      vx_min: -0.20
      vy_max: 0.00
      wz_max: 1.50
      ax_max: 0.75
      ax_min: -1.00
      ay_max: 0.00
      ay_min: 0.00
      az_max: 2.00
      prune_distance: 1.7
      # Allow one delayed 10 Hz localization update under accelerated Isaac
      # rendering load; smaller values can request map->odom just ahead of the
      # latest SLAM Toolbox transform and abort FollowPath.
      transform_tolerance: 0.50
      temperature: 0.30
      gamma: 0.015
      motion_model: DiffDrive
      # Required for MPPI's real local trajectory (/optimal_trajectory) and
      # transformed reference path. Candidate markers remain lazy unless the
      # heavyweight /trajectories topic has an explicit subscriber.
      visualize: true
      regenerate_noises: true
      critics: [ConstraintCritic, CostCritic, GoalCritic,
                GoalAngleCritic, PathAlignCritic, PathFollowCritic,
                PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      footprint_padding: 0.01
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.50
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 25.0
          raytrace_min_range: 0.30
          obstacle_max_range: 25.0
          obstacle_min_range: 0.30
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      footprint_padding: 0.01
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.50
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 25.0
          raytrace_min_range: 0.30
          obstacle_max_range: 25.0
          obstacle_min_range: 0.30
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.30
        w_data: 0.20
        tolerance: 0.0000000001
        do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.10
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.20
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [1.0, 0.0, 1.5]
    min_velocity: [-0.2, 0.0, -1.5]
    max_accel: [0.75, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: /odom
    odom_duration: 0.10
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: /collision_monitor_state
    transform_tolerance: 0.20
    # Monitoring-camera benchmark: Scan P99 age 0.182 s. This permits two
    # missing 10 Hz frames plus 0.10 s scheduling margin, while a sustained
    # outage still stops the command chain within 0.40 s.
    source_timeout: 0.40
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [StopZone, SlowdownZone, ApproachZone]
    StopZone:
      type: polygon
      points: "[[0.32, 0.27], [0.32, -0.27], [-0.29, -0.27], [-0.29, 0.27]]"
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true
    SlowdownZone:
      type: polygon
      points: "[[0.55, 0.42], [0.55, -0.42], [-0.45, -0.42], [-0.45, 0.42]]"
      action_type: slowdown
      min_points: 3
      slowdown_ratio: 0.35
      visualize: true
      polygon_pub_topic: /collision_monitor/slowdown_zone
      enabled: true
    ApproachZone:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 3
      visualize: false
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true
