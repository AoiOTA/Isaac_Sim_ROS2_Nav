bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0

    navigators: [navigate_to_pose, navigate_through_poses]

    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator


controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    # MPPI replans at 20 Hz, matching its 0.05 s model step and preserving
    # sequence shifting.  The downstream smoother runs at the 60 Hz physics
    # cadence and interpolates each selected control into continuous actuator
    # commands instead of emitting visible 20 Hz velocity stairs.
    controller_frequency: 20.0
    costmap_update_timeout: 0.30

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3
    odom_topic: /odom

    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    # 允许纯旋转也被认为取得进展。
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.15
      movement_time_allowance: 20.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # Keep route progression independent from the report's 0.25 m GT gate,
      # but do not require the final 1--2 cm that can trap a physical run in
      # repeated recoveries. The 0.20 m Nav2 radius is a strict 5 cm margin
      # inside the report gate and lets a visibly settled room goal dispatch
      # the following waypoint.
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.174532925

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController

      # 40 × 0.05 = 2 秒预测范围。模型步长与 20 Hz 控制周期一致，
      # 以提高动态绕障中的转向更新精度而不缩短预测视野。
      time_steps: 40
      model_dt: 0.05
      # The seven-run static campaign exposed repeated cases where the fixed
      # Keep the rollout work bounded after halving model_dt.  500 samples
      # preserves a dense candidate set while leaving enough compute budget
      # for every 20 Hz control update to complete on time.
      batch_size: 500
      iteration_count: 1
      # Do not immediately escalate a single exhausted candidate bank to the
      # BT recovery tree.  Retry with freshly sampled controls first; this
      # avoids unnecessary FollowPath abort -> costmap-clear -> replan cycles
      # without changing the action timeout or accepting a less-safe path.
      retry_attempt_limit: 3

      # Permit a small reverse sample near tight terminal poses.  This lets
      # MPPI re-centres at the G1 return point after a dynamic interaction instead of remaining
      # a few centimetres outside the acceptance circle until timeout.
      # A fresh noise bank is required for retry_attempt_limit to explore a
      # different control set after a short-lived RGB-D / LaserScan costmap
      # change.  Reusing the same exhausted bank was the common source of the
      # repeated "Optimizer fail to compute path" bursts in the campaign.
      # The bounded standard deviations still favour continuous turning arcs
      # instead of alternating crawl / stop corrections at corridor entries.
      # Keep the dynamic bypass brisk but not so fast that each 20 Hz MPPI
      # replan has to correct a large lateral displacement.  The narrower
      # bank avoids repeatedly saturating candidates at vx_max, which showed
      # up as visible speed steps around the moving actor.
      vx_std: 0.90
      vy_std: 0.00
      # The measured bypass needs a broad angular candidate bank to select a
      # continuous evasive arc before reaching the actor.  wz_max remains the
      # hard 3.40 rad/s ceiling.
      wz_std: 3.40

      # Forward motion remains strongly preferred, but a bounded reverse
      # sample is available for terminal-pose recovery in narrow rooms.
      # The local-bypass interaction takes place in the open central hall.
      # 1.20 m/s leaves enough forward authority for a continuous right-side
      # bypass while reducing overshoot and high-frequency path corrections
      # in the indoor doorway approach.
      vx_max: 1.20
      vx_min: -0.15
      vy_max: 0.00
      # The skid-steer plant under-rotates by about 5% at high yaw rates.
      # Command 3.40 rad/s so the Ground-Truth body yaw reaches the required
      # 3.14 rad/s after the complete Nav2 safety chain.
      wz_max: 3.40

      # Match the verified drive hard limits.  The previous 3.0 m/s² /
      # 6.28 rad/s² command-chain caps unnecessarily delayed the first
      # evasive arc even though the robot can safely supply 3.5 m/s² and
      # 6.5 rad/s².  Keeping both MPPI and the smoother at these values makes
      # the response prompt while retaining bounded, continuous commands.
      ax_max: 3.50
      ax_min: -3.50
      ay_max: 0.00
      ay_min: 0.00
      az_max: 6.50

      prune_distance: 1.50
      transform_tolerance: 0.50

      temperature: 0.35
      # Increase the MPPI control-effort regularisation modestly.  This makes
      # successive 20 Hz optimum sequences prefer a continuous arc over
      # equally safe left/right corrections, while retaining the full dynamic
      # limits for a real evasive manoeuvre.
      gamma: 0.030

      motion_model: DiffDrive
      # Keep publishing the selected trajectory for RViz, but aggressively
      # downsample debug candidates.  Serialising a dense 500 x 40 marker set
      # every control cycle can steal time from the controller and make the
      # GUI look like the vehicle is stuttering.
      visualize: true
      TrajectoryVisualizer:
        trajectory_step: 25
        time_step: 5
      regenerate_noises: true

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        # The rectangular footprint remains collision-checked at every
        # prediction point.  In the open local-bypass hall, a stronger soft
        # obstacle gradient makes MPPI commit early to the free right-side
        # arc instead of following the stale centre line until the actor's
        # kinematic safety guard must intervene.  Hard collision checking is
        # unchanged.
        # Bias the first feasible rollouts away from a newly seen dynamic
        # actor before the hard footprint critic needs to reject them.
        cost_weight: 2.50
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 1

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.5
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        # The intermediate yaw intentionally faces the following leg, not
        # necessarily the incoming leg. Do not rotate toward it one metre
        # early: that leaves the robot facing away from its still-unreached
        # position goal and forces a fragile reverse correction. Start final
        # heading alignment only after the 0.20 m position gate is reached.
        threshold_to_consider: 0.20

      # 窄通道内膨胀代价占比天然较高，仍保持 PathAlign 工作以避免左右摆动。
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Balance centring against forward progress.  An overly dominant
        # alignment score rewards slow samples in narrow corridors.
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.50
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 8
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        # Reward useful progress without overpowering the newly observed
        # local obstacle.  The validated dynamic run needs a lateral right
        # arc before it can resume forward path progress.
        # Leave enough freedom for an immediate lateral bypass instead of
        # following the pre-obstacle global path for one more control cycle.
        cost_weight: 14.0
        offset_from_furthest: 10
        threshold_to_consider: 1.4

      # 大角度偏差时尽早修正朝向；正常导航明确以前进为主。
      PathAngleCritic:
        enabled: true
        cost_power: 1
        # Keep heading establishment dominant over pure path progress at the
        # entrance to G3→G4; otherwise the faster samples delay the turn and
        # then need a visible correction in the narrow section.
        cost_weight: 10.5
        offset_from_furthest: 8
        threshold_to_consider: 0.7
        max_angle_to_furthest: 0.45
        mode: 0

      # 与路径角度 critic 协同强化前进路径选择。恢复行为可短距离倒车，
      # 但正常 MPPI 路径跟踪不生成负线速度。
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # Reverse remains available only when a terminal pose genuinely needs
        # it.  A strong prior prevents low-box avoidance from oscillating
        # between forward and reverse samples in the open S→G1 area.
        cost_weight: 30.0
        threshold_to_consider: 0.5


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      # Dynamic actors are sampled at 20 Hz.  Rebuild the rolling map at the
      # same cadence so MPPI receives the first LiDAR marking on its next
      # control cycle rather than waiting for a second costmap period.
      update_frequency: 20.0
      publish_frequency: 10.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      # The footprint already matches the physical wheel envelope. Keep a
      # small numerical shell without consuming a narrow doorway twice.
      footprint_padding: 0.005

      plugins: [obstacle_layer, depth_voxel_layer, inflation_layer]

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        combination_method: 1
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 0.50

          clearing: true
          marking: true
          data_type: LaserScan

          raytrace_max_range: 25.0
          raytrace_min_range: 0.40
          obstacle_max_range: 25.0
          obstacle_min_range: 0.40

      # Keep RGB-D observations in an independent layer. This prevents the
      # LiDAR clearing rays from clearing low obstacles marked by the camera.
      depth_voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        publish_voxel_map: true
        tf_filter_tolerance: 0.10

        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        # A front-only camera leaves most columns unobserved at every frame.
        # Do not project a fully unobserved 16-voxel column as NO_INFORMATION:
        # it can overwrite a StaticLayer free cell beside/behind the robot and
        # block the final lateral approach to a room goal. Observed depth
        # returns still mark low obstacles normally.
        unknown_threshold: 16
        mark_threshold: 0
        max_obstacle_height: 0.50

        # Costmap2D observation_sources is declared as a string in Nav2 Jazzy;
        # multiple sources, when needed, are separated by spaces.
        observation_sources: camera_depth

        camera_depth:
          topic: /camera/front/depth/points
          sensor_frame: camera_front_optical_frame
          data_type: PointCloud2
          transport_type: raw
          marking: true
          # Dynamic actors must be removed as soon as the background becomes
          # visible again.  Enable per-frame ray clearing instead of keeping
          # a marking-only history, so an actor crossing the hall cannot leave
          # a horizontal obstacle trail in the rolling costmap.
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          obstacle_min_range: 0.05
          obstacle_max_range: 2.0
          raytrace_min_range: 0.05
          raytrace_max_range: 2.5
          # Consume only the current depth frame.  The next background frame
          # clears a departed dynamic actor instead of extending its obstacle
          # footprint along the direction of travel.
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: false

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 0.40 m remains above the padded 0.337 m circumscribed radius.  The
        # steeper decay preserves collision checking while allowing the MPPI
        # controller to use valid corridor-centre cells.
        # Preserve the 0.40 m inflation radius and footprint collision test,
        # but make its soft gradient decay sooner in a valid narrow corridor.
        cost_scaling_factor: 9.0
        inflation_radius: 0.40

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05
      track_unknown_space: true

      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      footprint_padding: 0.005

      # Global planning consumes the static map plus live LiDAR only. Front
      # depth has a limited FOV and leaves long stale marking trails when a
      # dynamic actor moves; keep it in the rolling Local Costmap instead.
      plugins: [static_layer, obstacle_layer, inflation_layer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 0.50

          clearing: true
          marking: true
          data_type: LaserScan

          raytrace_max_range: 25.0
          raytrace_min_range: 0.40
          obstacle_max_range: 25.0
          obstacle_min_range: 0.40

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 9.0
        inflation_radius: 0.40

      always_send_full_costmap: true


planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0

    planner_plugins: [GridBased]

    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D

      # Keep a substitute endpoint strictly inside the 0.20 m action
      # acceptance radius. This gives the global RGB-D layer a one-cell
      # fallback for a temporarily marked target cell without allowing a
      # visibly early goal completion.
      tolerance: 0.10
      downsample_costmap: false
      allow_unknown: true

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0

      # Keep a preference for open space, but do not reject the only valid
      # route merely because both walls inflate the corridor centreline.
      cost_travel_multiplier: 1.2
      use_final_approach_orientation: false

      smoother:
        max_iterations: 1000
        w_smooth: 0.30
        w_data: 0.20
        tolerance: 0.0000000001
        do_refinement: true


behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw

    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins: [spin, backup, drive_on_heading, wait]

    spin:
      plugin: nav2_behaviors::Spin

    backup:
      plugin: nav2_behaviors::BackUp

    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading

    wait:
      plugin: nav2_behaviors::Wait

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

    transform_tolerance: 0.10
    # In a narrow cul-de-sac the local costmap can report the robot's current
    # rectangular footprint as occupied even though manual reverse is clear.
    # Any positive value makes BackUp test that already-occupied start pose and
    # abort immediately with COLLISION_AHEAD. Disable this duplicate costmap
    # rollout for recovery behaviors; /collision_monitor still applies the
    # live lidar StopZone, ApproachZone and command hard-stop to every reverse
    # velocity sent to the robot.
    simulate_ahead_time: 0.0

    max_rotational_vel: 1.0
    min_rotational_vel: 0.12
    rotational_acc_lim: 3.0


velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    # Isaac advances physics at 60 Hz.  Keep the optimizer at 20 Hz but emit
    # acceleration-limited intermediate commands on every physics tick.  At
    # az_max=6.50 this reduces a single angular increment from 0.325 rad/s
    # to about 0.108 rad/s without reducing the available turn authority.
    smoothing_frequency: 60.0
    stamp_smoothed_velocity_with_smoothing_time: false

    # 线速度受到限制时，按比例保留角速度，避免转弯曲率被破坏。
    scale_velocities: true

    feedback: OPEN_LOOP

    max_velocity: [1.20, 0.0, 3.40]
    # MPPI仍以 vx_min=0 前进跟踪；这里单独允许行为树 BackUp 的有限负速，
    # 否则 -0.18 m/s 恢复命令会被平滑器钳成零而无法离开死胡同。
    min_velocity: [-0.25, 0.0, -3.40]

    # Keep this exactly aligned with MPPI's physical acceleration envelope;
    # otherwise Velocity Smoother silently turns a selected evasive arc into
    # a slow, late response.
    max_accel: [3.50, 0.0, 6.50]
    max_decel: [-3.50, 0.0, -6.50]

    odom_topic: /odom
    odom_duration: 0.10

    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50


collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    base_frame_id: base_link
    odom_frame_id: odom

    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: /collision_monitor_state

    transform_tolerance: 0.20
    # Monitoring-camera benchmark: Scan P99 age 0.182 s. This permits two
    # missing 10 Hz frames plus 0.10 s scheduling margin, while a sustained
    # outage still stops the command chain within 0.40 s.
    source_timeout: 0.40
    base_shift_correction: true
    stop_pub_timeout: 1.0

    polygons: [StopZone, SlowdownZone, ApproachZone]

    StopZone:
      type: polygon
      # Physical footprint is x=[-0.230, 0.255], y=+/-0.210 m.  This zone keeps
      # a 20--30 mm emergency shell, rather than the former 60 mm lateral shell
      # that was continuously triggered by parallel walls in narrow passages.
      points: "[[0.285, 0.230], [0.285, -0.230], [-0.250, -0.230], [-0.250, 0.230]]"

      action_type: stop
      min_points: 3

      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true

    SlowdownZone:
      type: polygon
      # Keep a useful warning shell around StopZone without continuously
      # catching parallel walls in a valid narrow corridor.  The physical
      # footprint is y=+/-0.210 m and the emergency shell is y=+/-0.230 m.
      # Keep the warning shell just outside the 20 mm StopZone shell.  The
      # former 5 mm lateral expansion was repeatedly occupied by parallel
      # wall returns in the valid G3→G4 passage, causing needless crawl/stop
      # cycles.  Hard StopZone protection remains unchanged.
      points: "[[0.36, 0.232], [0.36, -0.232], [-0.30, -0.232], [-0.30, 0.232]]"

      action_type: slowdown
      min_points: 6
      # Preserve steering authority and forward progress when slowdown is
      # genuinely required; StopZone still provides the final hard stop.
      slowdown_ratio: 0.90

      visualize: true
      polygon_pub_topic: /collision_monitor/slowdown_zone
      enabled: true

    ApproachZone:
      type: polygon
      action_type: approach

      footprint_topic: /local_costmap/published_footprint

      # MPPI already collision-checks the complete footprint against both
      # costmap layers.  In narrow passages this predictive action repeatedly
      # rescales commands as individual LiDAR returns vary; SlowdownZone and
      # StopZone remain the final LiDAR safety layers.
      time_before_collision: 1.00
      simulation_time_step: 0.10
      min_points: 3

      visualize: false
      enabled: false

    # The low RGB-D test box is below the LiDAR plane.  Feed the same depth
    # cloud that marks the VoxelLayer into the last-resort safety monitor, so
    # an unmodelled local-costmap gap cannot become a physical contact.
    # RGB-D is fused into both costmaps; keep Collision Monitor's hard stop on
    # LiDAR only so ordinary near-field depth returns cannot deadlock a valid
    # doorway traversal.  Physical contact remains an independent verdict.
    observation_sources: [scan]

    scan:
      type: scan
      topic: /scan
      enabled: true

    camera_depth:
      type: pointcloud
      topic: /camera/front/depth/points
      min_height: 0.05
      max_height: 0.50
      enabled: true
