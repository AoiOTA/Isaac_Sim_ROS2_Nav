bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0

    navigators: [navigate_to_pose, navigate_through_poses]

    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator


controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    controller_frequency: 10.0
    costmap_update_timeout: 0.30

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3
    odom_topic: /odom

    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    # 允许纯旋转也被认为取得进展。
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.15
      movement_time_allowance: 20.0

    goal_checker:
      plugin: nav2_controller::PositionGoalChecker
      stateful: true
      # V6 route points are XY-only. PositionGoalChecker intentionally ignores
      # the protocol orientation field and never adds a terminal yaw gate.
      xy_goal_tolerance: 0.20

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController

      # 20 × 0.10 = 2 秒预测范围。
      time_steps: 20
      model_dt: 0.10
      # The seven-run static campaign exposed repeated cases where the fixed
      # 500-sample bank contained no collision-free rollout for a transient
      # local-costmap state.  700 remains within the 10 Hz controller budget.
      # A 1000-sample validation failed its first warmup at the same G4 turn,
      # proving that a larger bank does not repair that progress stall.
      batch_size: 700
      iteration_count: 1
      # Do not immediately escalate a single exhausted candidate bank to the
      # BT recovery tree.  Retry with freshly sampled controls first; this
      # avoids unnecessary FollowPath abort -> costmap-clear -> replan cycles
      # without changing the action timeout or accepting a less-safe path.
      retry_attempt_limit: 3

      # A fresh noise bank is required for retry_attempt_limit to explore a
      # different control set after a short-lived RGB-D / LaserScan costmap
      # change.  Reusing the same exhausted bank was the common source of the
      # repeated "Optimizer fail to compute path" bursts in the campaign.
      # The bounded standard deviations still favour continuous turning arcs
      # instead of alternating crawl / stop corrections at corridor entries.
      vx_std: 0.35
      vy_std: 0.00
      wz_std: 0.75

      # Preserve a bounded reverse sample for terminal-pose centring.  A
      # forward-only validation reached the G3 position tolerance but could
      # not settle its required yaw, so reversing cannot be removed globally.
      vx_max: 0.75
      vx_min: -0.15
      vy_max: 0.00
      wz_max: 1.35

      ax_max: 1.25
      ax_min: -1.10
      ay_max: 0.00
      ay_min: 0.00
      az_max: 3.50

      prune_distance: 1.50
      transform_tolerance: 0.50

      temperature: 0.35
      gamma: 0.015

      motion_model: DiffDrive
      # Publish both /optimal_trajectory and /trajectories so the controller's
      # selected path and sampled candidates can be inspected live in RViz.
      visualize: true
      regenerate_noises: true

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        # The rectangular footprint remains collision-checked at every
        # prediction point.  A lower soft-cost weight lets valid trajectories
        # traverse the centre of narrow, symmetrically inflated corridors.
        # Hard footprint collision checking remains enabled.  Reduce only the
        # soft obstacle gradient slightly so RGB-D low-box avoidance chooses
        # a continuous bypass instead of alternating crawl / re-sample steps.
        cost_weight: 1.35
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 1

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.5
        threshold_to_consider: 1.4

      # 窄通道内膨胀代价占比天然较高，仍保持 PathAlign 工作以避免左右摆动。
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Balance centring against forward progress.  An overly dominant
        # alignment score rewards slow samples in narrow corridors.
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.50
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 8
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        # Reward useful progress along the path instead of allowing a
        # well-aligned but persistently slow trajectory to dominate.
        cost_weight: 10.0
        offset_from_furthest: 10
        threshold_to_consider: 1.4

      # 大角度偏差时尽早修正朝向；正常导航明确以前进为主。
      PathAngleCritic:
        enabled: true
        cost_power: 1
        # Keep heading establishment dominant over pure path progress at the
        # entrance to G3→G4; otherwise the faster samples delay the turn and
        # then need a visible correction in the narrow section.
        cost_weight: 10.5
        offset_from_furthest: 8
        threshold_to_consider: 0.7
        max_angle_to_furthest: 0.45
        mode: 0

      # 与路径角度 critic 协同强化前进路径选择，同时保留终点有限倒车。
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # Penalize routine reverse motion while keeping it feasible for the
        # last centimetres of terminal position/yaw convergence.
        cost_weight: 30.0
        threshold_to_consider: 0.5


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      # RGB-D 与 LiDAR 在该场景实际约为 6--8 Hz；10 Hz 已能消费下一帧，
      # 又避免与 MPPI 争用计算资源。这也是静态和动态共用的更新预算。
      update_frequency: 10.0
      publish_frequency: 5.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      # The footprint already matches the physical wheel envelope. Keep a
      # small numerical shell without consuming a narrow doorway twice.
      footprint_padding: 0.005

      plugins: [obstacle_layer, inflation_layer]

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        combination_method: 1
        observation_sources: scan

        scan:
          # Local control uses the self-filtered projection so mapped and
          # unmapped obstacles remain visible inside the legacy /scan
          # projection's 0.40 m self-return exclusion radius.
          topic: /scan_safety
          max_obstacle_height: 0.50

          clearing: true
          marking: true
          data_type: LaserScan

          raytrace_max_range: 25.0
          raytrace_min_range: 0.05
          obstacle_max_range: 25.0
          obstacle_min_range: 0.05

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 0.40 m remains above the padded 0.337 m circumscribed radius.  The
        # steeper decay preserves collision checking while allowing the MPPI
        # controller to use valid corridor-centre cells.
        # Preserve the 0.40 m inflation radius and footprint collision test,
        # but make its soft gradient decay sooner in a valid narrow corridor.
        cost_scaling_factor: 9.0
        inflation_radius: 0.40

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05
      track_unknown_space: true

      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      footprint_padding: 0.005

      plugins: [static_layer, obstacle_layer, inflation_layer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 0.50

          clearing: true
          marking: true
          data_type: LaserScan

          raytrace_max_range: 25.0
          raytrace_min_range: 0.40
          obstacle_max_range: 25.0
          obstacle_min_range: 0.40

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 9.0
        inflation_radius: 0.40

      always_send_full_costmap: true


planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0

    planner_plugins: [GridBased]

    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D

      # Keep a substitute endpoint strictly inside the 0.20 m action
      # acceptance radius. This gives the global RGB-D layer a one-cell
      # fallback for a temporarily marked target cell without allowing a
      # visibly early goal completion.
      tolerance: 0.10
      downsample_costmap: false
      allow_unknown: true

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0

      # Keep a preference for open space, but do not reject the only valid
      # route merely because both walls inflate the corridor centreline.
      cost_travel_multiplier: 1.2
      # Together with PositionGoalChecker and no RotationShim controller,
      # this is the valid V6 meaning of rotate_to_goal_heading=false. Do not
      # declare the RotationShim-only parameter on MPPI.
      use_final_approach_orientation: false

      smoother:
        # Keep the standard smoother: an isolated-topic diagnostic showed the
        # raw 8-connected path itself contains one-cell reversals, disproving
        # the earlier mixed-topic hypothesis that smoothing created them.
        max_iterations: 1000
        w_smooth: 0.30
        w_data: 0.20
        tolerance: 0.0000000001
        do_refinement: true


behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw

    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins: [spin, backup, drive_on_heading, wait]

    spin:
      plugin: nav2_behaviors::Spin

    backup:
      plugin: nav2_behaviors::BackUp

    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading

    wait:
      plugin: nav2_behaviors::Wait

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

    transform_tolerance: 0.10
    # In a narrow cul-de-sac the local costmap can report the robot's current
    # rectangular footprint as occupied even though manual reverse is clear.
    # Any positive value makes BackUp test that already-occupied start pose and
    # abort immediately with COLLISION_AHEAD. Disable this duplicate costmap
    # rollout for recovery behaviors; /collision_monitor still applies the
    # live lidar StopZone, ApproachZone and command hard-stop to every reverse
    # velocity sent to the robot.
    simulate_ahead_time: 0.0

    max_rotational_vel: 1.0
    min_rotational_vel: 0.12
    rotational_acc_lim: 3.0


velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false

    # 线速度受到限制时，按比例保留角速度，避免转弯曲率被破坏。
    scale_velocities: true

    max_velocity: [0.75, 0.0, 1.35]
    # MPPI仍以 vx_min=0 前进跟踪；这里单独允许行为树 BackUp 的有限负速，
    # 否则 -0.18 m/s 恢复命令会被平滑器钳成零而无法离开死胡同。
    min_velocity: [-0.25, 0.0, -1.35]

    max_accel: [1.25, 0.0, 3.50]
    max_decel: [-1.10, 0.0, -3.50]

    odom_topic: /odom
    feedback: OPEN_LOOP
    odom_duration: 0.10

    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50


collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    base_frame_id: base_link
    odom_frame_id: odom

    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: /collision_monitor_state

    transform_tolerance: 0.20
    # Monitoring-camera benchmark: Scan P99 age 0.182 s. This permits two
    # missing 10 Hz frames plus 0.10 s scheduling margin, while a sustained
    # outage still stops the command chain within 0.40 s.
    source_timeout: 0.40
    base_shift_correction: true
    stop_pub_timeout: 1.0

    polygons: [StopZone, SlowdownZone, ApproachZone]

    StopZone:
      type: polygon
      # Physical footprint is x=[-0.230, 0.255], y=+/-0.210 m.  Preserve the
      # narrow 20 mm lateral shell that avoids parallel-wall false stops, but
      # reserve 175 mm longitudinal stopping distance ahead of the footprint.
      # At the 0.70 m/s command limit this covers one 10 Hz scan interval plus
      # monitor/controller actuation latency and a small residual margin.
      points: "[[0.430, 0.230], [0.430, -0.230], [-0.250, -0.230], [-0.250, 0.230]]"

      action_type: stop
      min_points: 3

      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true

    SlowdownZone:
      type: polygon
      # Keep a useful longitudinal warning shell around StopZone without
      # catching parallel walls in a valid narrow corridor.  The lateral
      # bounds remain only 22 mm outside the physical footprint; expanding
      # them further previously caused needless crawl/stop cycles in G3→G4.
      points: "[[0.55, 0.232], [0.55, -0.232], [-0.30, -0.232], [-0.30, 0.232]]"

      action_type: slowdown
      min_points: 6
      # Preserve steering authority and forward progress when slowdown is
      # genuinely required; StopZone still provides the final hard stop.
      slowdown_ratio: 0.90

      visualize: true
      polygon_pub_topic: /collision_monitor/slowdown_zone
      enabled: true

    ApproachZone:
      type: polygon
      action_type: approach

      footprint_topic: /local_costmap/published_footprint

      # MPPI already collision-checks the complete footprint against both
      # costmap layers.  In narrow passages this predictive action repeatedly
      # rescales commands as individual LiDAR returns vary; SlowdownZone and
      # StopZone remain the final LiDAR safety layers.
      time_before_collision: 1.00
      simulation_time_step: 0.10
      min_points: 3

      visualize: false
      enabled: false

    # The mapping/localization /scan intentionally excludes everything within
    # 0.40 m to remove rendered chassis returns. Collision Monitor instead
    # consumes the independent self-filtered projection whose 0.05 m minimum
    # range covers the complete StopZone without changing SLAM input.
    observation_sources: [scan_safety]

    scan_safety:
      type: scan
      topic: /scan_safety
      enabled: true

    camera_depth:
      type: pointcloud
      topic: /camera/front/depth/points
      min_height: 0.05
      max_height: 0.50
      enabled: true
