bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0

    navigators: [navigate_to_pose, navigate_through_poses]

    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator


controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    controller_frequency: 10.0
    costmap_update_timeout: 0.30

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3
    odom_topic: /odom

    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    # 允许纯旋转也被认为取得进展。
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.15
      movement_time_allowance: 20.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # Avoid declaring success while the chassis is still visibly short of
      # the requested pose.  The experiment gate independently checks
      # Ground Truth at 0.25 m / 10 deg, so Nav2 must converge more tightly
      # than that external acceptance envelope.
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.174532925

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController

      # 20 × 0.10 = 2 秒预测范围。
      time_steps: 20
      model_dt: 0.10
      # 保留 2 秒预测窗，用 500 samples 避免与 Ceres 定位争抢控制周期。
      batch_size: 500
      iteration_count: 1

      # Forward-only navigation stress-test profile.  Skid-steer reverse
      # remains available at the direct chassis layer and can be restored
      # after forward path-following/avoidance acceptance is complete.
      vx_std: 0.25
      vy_std: 0.00
      wz_std: 0.70

      # 前进不再掩盖转弯；本阶段关闭导航倒车采样。
      vx_max: 0.65
      vx_min: 0.00
      vy_max: 0.00
      wz_max: 1.20

      ax_max: 0.80
      ax_min: -1.00
      ay_max: 0.00
      ay_min: 0.00
      az_max: 3.00

      prune_distance: 1.50
      transform_tolerance: 0.50

      temperature: 0.30
      gamma: 0.015

      motion_model: DiffDrive
      visualize: false
      regenerate_noises: true

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.6

      # 提前贴合局部路径，但仍允许为避障和倒车偏离中心线。
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.10
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 12
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      # 大角度偏差时尽早修正朝向；正常导航明确以前进为主。
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 6
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.45
        mode: 0

      # 与路径角度 critic 协同强化前进路径选择。底盘直接控制层仍保留
      # 倒车能力，但本阶段导航控制器不生成负线速度。
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 10.0
      publish_frequency: 5.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      footprint_padding: 0.01

      plugins: [obstacle_layer, inflation_layer]

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 0.50

          clearing: true
          marking: true
          data_type: LaserScan

          raytrace_max_range: 25.0
          raytrace_min_range: 0.30
          obstacle_max_range: 25.0
          obstacle_min_range: 0.30

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05
      track_unknown_space: true

      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      footprint_padding: 0.01

      plugins: [static_layer, obstacle_layer, inflation_layer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 0.50

          clearing: true
          marking: true
          data_type: LaserScan

          raytrace_max_range: 25.0
          raytrace_min_range: 0.30
          obstacle_max_range: 25.0
          obstacle_min_range: 0.30

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: true


planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0

    planner_plugins: [GridBased]

    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D

      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0

      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

      smoother:
        max_iterations: 1000
        w_smooth: 0.30
        w_data: 0.20
        tolerance: 0.0000000001
        do_refinement: true


behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw

    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins: [spin, backup, drive_on_heading, wait]

    spin:
      plugin: nav2_behaviors::Spin

    backup:
      plugin: nav2_behaviors::BackUp

    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading

    wait:
      plugin: nav2_behaviors::Wait

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

    transform_tolerance: 0.10
    simulate_ahead_time: 2.0

    max_rotational_vel: 1.0
    min_rotational_vel: 0.12
    rotational_acc_lim: 3.0


velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false

    # 线速度受到限制时，按比例保留角速度，避免转弯曲率被破坏。
    scale_velocities: true

    feedback: OPEN_LOOP

    max_velocity: [0.65, 0.0, 1.20]
    min_velocity: [0.00, 0.0, -1.20]

    max_accel: [0.80, 0.0, 3.00]
    max_decel: [-1.00, 0.0, -3.00]

    odom_topic: /odom
    odom_duration: 0.10

    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50


collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

    base_frame_id: base_link
    odom_frame_id: odom

    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: /collision_monitor_state

    transform_tolerance: 0.20
    source_timeout: 0.50
    base_shift_correction: true
    stop_pub_timeout: 1.0

    polygons: [StopZone, SlowdownZone, ApproachZone]

    StopZone:
      type: polygon
      points: "[[0.32, 0.27], [0.32, -0.27], [-0.29, -0.27], [-0.29, 0.27]]"

      action_type: stop
      min_points: 3

      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true

    SlowdownZone:
      type: polygon
      points: "[[0.55, 0.42], [0.55, -0.42], [-0.45, -0.42], [-0.45, 0.42]]"

      action_type: slowdown
      min_points: 3
      slowdown_ratio: 0.35

      visualize: true
      polygon_pub_topic: /collision_monitor/slowdown_zone
      enabled: true

    ApproachZone:
      type: polygon
      action_type: approach

      footprint_topic: /local_costmap/published_footprint

      time_before_collision: 1.20
      simulation_time_step: 0.10
      min_points: 3

      visualize: false
      enabled: true

    observation_sources: [scan]

    scan:
      type: scan
      topic: /scan
      enabled: true
