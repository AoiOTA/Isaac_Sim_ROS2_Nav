# Static MPPI envelope with a junction-level goal tolerance for the bounded
# real-GVG causal demo. Normal campaigns continue to use nav2_stable.yaml.
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    goal_checker:
      # Below half of the 0.174 m first support segment at junction node 38,
      # while remaining attainable by the physical MPPI controller.
      xy_goal_tolerance: 0.08
    FollowPath:
      time_steps: 20
      model_dt: 0.10
      batch_size: 700
      vx_std: 0.35
      wz_std: 0.75
      vx_max: 0.75
      wz_max: 1.35
      ax_max: 1.25
      ax_min: -1.10
      az_max: 3.50
      gamma: 0.015
      CostCritic:
        cost_weight: 1.35
      PathFollowCritic:
        cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        scan: {raytrace_min_range: 0.05, inf_is_valid: false}

global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        scan: {raytrace_min_range: 0.40, inf_is_valid: false}

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    max_velocity: [0.75, 0.0, 1.35]
    min_velocity: [-0.25, 0.0, -1.35]
    max_accel: [1.25, 0.0, 3.50]
    max_decel: [-1.10, 0.0, -3.50]
    feedback: OPEN_LOOP
