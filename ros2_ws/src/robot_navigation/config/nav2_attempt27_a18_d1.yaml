# Attempt27 A18 diagnostic D1 delta: D0 plus a 0.6 second Controller Server
# failure tolerance.  This file is never loaded by A1.
controller_server:
  ros__parameters:
    failure_tolerance: 0.6
    publish_zero_velocity: true
    controller_plugins: [FollowPath]
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker, a18_crossing_goal_checker]
    a18_crossing_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.141592654
