# Attempt28 A19 diagnostic D1 delta.  D1 retains the dynamic sensor / STVL
# profile and its 15 Hz, two-second prediction horizon, but uses the validated
# bounded MPPI sampling envelope for portal execution.  Engineering evidence
# showed the dynamic base envelope saturating at 3.4 rad/s and repeatedly
# spinning beside a footprint-feasible portal path.
planner_server:
  ros__parameters:
    GridBased:
      tolerance: 0.0

"/local_costmap/local_costmap":
  ros__parameters:
    # Portal-122 needs 45.5 mm beyond the base Y window and portal-169 needs
    # 365 mm beyond the base X window. Nav2 accepts integer metres only.
    width: 5
    height: 5

controller_server:
  ros__parameters:
    failure_tolerance: 0.6
    publish_zero_velocity: true
    controller_plugins: [FollowPath]
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker, a19_crossing_goal_checker]
    a19_crossing_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.141592654
    FollowPath:
      # A19 paths are sampled on a 0.05 m grid and may contain tight portal
      # corners. The MPPI default searches roughly half the local costmap for
      # the Euclidean-nearest pose, which can prune across an unexecuted corner
      # when a later leg passes close to the robot. The 0.21 m bound includes
      # the measured four-pose recovery distance at portal-152 while excluding
      # the measured five-pose nonlocal corner jump in the same controller
      # cycle. Reverse-neutral critics below handle the recovered path leg.
      max_robot_pose_search_dist: 0.21
      # A bounded reverse correction is required when the audited A19 path
      # explicitly preserves a live heading opposite its positional travel.
      # Mode 2 consumes those feasible path orientations. Mode 1 only chooses
      # whichever of forward/reverse is angularly closer and therefore cannot
      # distinguish an intended reverse approach from the undesired reverse
      # basin observed at portal-152. Keep the orientation critic active until
      # the same 0.20 m terminal band where PreferForward turns off; the base
      # 0.70 m threshold disabled direction scoring before portal-152's west-
      # to-north corner and let forward motion carry the robot past the bend.
      PathAngleCritic:
        mode: 2
        threshold_to_consider: 0.20
      # Keep a small forward tie-break while allowing an explicitly audited
      # long reverse approach.  Weight 6.0 was introduced while PathAngle used
      # mode 1; after mode 2 began consuming the audited path orientations it
      # became redundant and stalled portal-168's required 1.52 m reverse
      # approach for the complete 20 s progress window.  Weight 2.0 contributes
      # at most 0.6 cost for the full bounded -0.15 m/s horizon.  Directional
      # intent is now supplied by the mode-2 path orientation, while this small
      # term continues to break otherwise equal forward choices.
      PreferForwardCritic:
        # Mode-2 PathAngle binds motion direction to the audited orientation,
        # but v83 showed that removing the forward basin entirely makes
        # portal-152 abort. Keep the tie-break at half the v82 weight: enough
        # to preserve the portal-152 basin while reducing its opposition to
        # portal-168's required reverse path. Collision, CostCritic and
        # velocity bounds remain unchanged.
        enabled: true
        cost_weight: 1.0
        threshold_to_consider: 0.20
      # Keep D1's candidate bank concentrated on continuous portal-following
      # controls.  These values match the validated stable envelope while the
      # active dynamic profile still supplies 30 x 0.0667 s rollouts at 15 Hz.
      vx_std: 0.35
      wz_std: 0.75
      vx_max: 0.75
      # v77 completed 15/16 audited crossings without a controller abort but
      # spent 115 portal-168 command samples pinned at the inherited
      # -0.15 m/s floor.  Match the already-frozen velocity_smoother reverse
      # limit so an explicitly oriented, fully audited reverse path can clear
      # the portal inside the leg budget.  Forward speed and every collision
      # boundary remain unchanged.
      vx_min: -0.25
      wz_max: 1.35
      ax_max: 1.25
      ax_min: -1.10
      az_max: 3.50
      gamma: 0.015
      CostCritic:
        # A19 independently hard-rejects 254/255 footprint intersections.
        # Cost 253 remains a soft ranking signal; using the dynamic base's
        # near_collision_cost=20 made every pose of a valid narrow-portal path
        # critical and caused controller oscillation instead of traversal.
        near_collision_cost: 253
        cost_weight: 1.35
