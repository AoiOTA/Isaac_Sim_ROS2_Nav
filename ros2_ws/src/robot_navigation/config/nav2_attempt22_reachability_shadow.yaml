# Attempt-22 development-only profile.
#
# The reachability observer sits after all obstacle-marking layers and before
# inflation. It publishes a read-only snapshot for the Integration sidecar;
# it does not modify the Nav2 costmap and does not authorize Module2 guidance.
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    FollowPath:
      time_steps: 20
      model_dt: 0.10
      batch_size: 700

global_costmap:
  global_costmap:
    ros__parameters:
      plugins:
        - static_layer
        - obstacle_layer
        - depth_voxel_layer
        - reachability_observer_layer
        - inflation_layer
      reachability_observer_layer:
        plugin: bio_nav_fusion::ReachabilityObserverLayer
        enabled: true
        output_topic: /global_costmap/reachability_observer_input

planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased:
      # The Shadow profile deliberately preserves the Module3 stock planner.
      plugin: nav2_smac_planner::SmacPlanner2D
