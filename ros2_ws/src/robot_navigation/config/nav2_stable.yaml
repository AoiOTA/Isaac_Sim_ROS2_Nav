controller_server:
  ros__parameters:
    # 静态 benchmark 使用 codex/kujiale-mppi-feasibility-tuning 中完成
    # 20 轮验证的控制预算。动态实验由 nav2_dynamic_avoidance.yaml 单独覆盖。
    controller_frequency: 10.0
    FollowPath:
      # 20 x 0.10 s = 2.0 s prediction horizon.
      time_steps: 20
      model_dt: 0.10
      batch_size: 1000

      vx_std: 0.35
      wz_std: 0.75
      vx_max: 0.75
      wz_max: 1.35
      ax_max: 1.25
      ax_min: -1.10
      az_max: 3.50
      gamma: 0.015

      CostCritic:
        cost_weight: 1.35
      PathFollowCritic:
        cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        scan:
          # The global/SLAM /scan contract remains at 0.40 m. The local
          # controller now consumes /scan_safety and must retain its
          # self-filtered footprint-adjacent returns.
          raytrace_min_range: 0.05
          inf_is_valid: false

global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        scan:
          # The verified static campaign did not use max-range clearing rays
          # in the global planning map.
          raytrace_min_range: 0.40
          inf_is_valid: false

velocity_smoother:
  ros__parameters:
    # Restore the historical static drive envelope. The saved RViz layout
    # disables candidate trajectories by default; it does not affect the
    # recorded MPPI control solution.
    smoothing_frequency: 20.0
    max_velocity: [0.75, 0.0, 1.35]
    min_velocity: [-0.25, 0.0, -1.35]
    max_accel: [1.25, 0.0, 3.50]
    max_decel: [-1.10, 0.0, -3.50]
    feedback: OPEN_LOOP
