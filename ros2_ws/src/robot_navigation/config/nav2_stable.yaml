controller_server:
  ros__parameters:
    controller_frequency: 10.0
    FollowPath:
      time_steps: 20
      model_dt: 0.10
      # Keep the stable overlay aligned with nav2_params.yaml and the verified
      # 10 Hz timing budget; a larger overlay silently defeated the intended
      # 500-sample low-latency controller configuration.
      batch_size: 500
