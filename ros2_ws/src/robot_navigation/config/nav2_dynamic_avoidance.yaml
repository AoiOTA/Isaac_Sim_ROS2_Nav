# Overlay used only by the reproducible Kujiale dynamic-obstacle experiments.
#
# The exact whole-house no-actor diagnostics proved that the former dynamic
# MPPI, inflation and alternative voxel/scan settings made the physically
# traversable G2->G3 junction fail even when no actor existed.  Keep the
# whole-house-validated base controller unchanged.  The frozen dynamic
# qualification scenario has no RGB-D-only static props.  A built-in
# VoxelLayer still retains marked voxels when a departed actor leaves no valid
# background point for raytracing; clearing a different LiDAR layer cannot
# erase those voxels.  Use the repository's existing STVL depth policy so
# camera marks have a bounded lifetime and visible empty frusta accelerate
# their removal.  Static and appearance runs retain the base non-clearing,
# one-second-persistence VoxelLayer policy.

controller_server:
  ros__parameters:
    # Profiles must declare a complete MPPI timing tuple for the pre-launch
    # Jazzy timing contract.  Repeat only the validated base timing budget;
    # all control/noise/critic limits inherit from the base file.
    controller_frequency: 10.0
    FollowPath:
      time_steps: 20
      model_dt: 0.10
      batch_size: 1000

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: [obstacle_layer, depth_stvl_layer, inflation_layer]
      obstacle_layer:
        scan:
          raytrace_min_range: 0.05
          inf_is_valid: false
      depth_stvl_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 0.75
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.10
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: camera_depth_mark camera_depth_clear
        camera_depth_mark:
          data_type: PointCloud2
          topic: /camera/front/depth/points
          marking: true
          clearing: false
          obstacle_range: 2.0
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: voxel
          voxel_min_points: 0
          clear_after_reading: true
        camera_depth_clear:
          data_type: PointCloud2
          topic: /camera/front/depth/points
          marking: false
          clearing: true
          min_z: 0.05
          max_z: 2.5
          vertical_fov_angle: 1.272
          horizontal_fov_angle: 1.839
          decay_acceleration: 15.0
          model_type: 0
global_costmap:
  global_costmap:
    ros__parameters:
      # A front-camera VoxelLayer cannot clear an actor after it leaves the
      # global field of view.  Keep dynamic RGB-D local; the global planner
      # uses the static map plus independently clearing LiDAR observations.
      plugins: [static_layer, obstacle_layer, inflation_layer]
      obstacle_layer:
        scan:
          raytrace_min_range: 0.40
          inf_is_valid: false

behavior_server:
  ros__parameters:
    # Dynamic runs must never issue the shared dead-end-recovery BackUp command
    # without checking its swept costmap footprint.  This affects only the
    # recovery behavior; normal MPPI commands and actor geometry are unchanged.
    simulate_ahead_time: 1.0
