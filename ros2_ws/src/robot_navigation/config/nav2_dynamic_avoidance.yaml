# Overlay used only by the reproducible Kujiale dynamic-obstacle experiments.
#
# The exact whole-house no-actor diagnostics proved that the former dynamic
# MPPI, inflation and alternative voxel/scan settings made the physically
# traversable G2->G3 junction fail even when no actor existed.  Keep the
# whole-house-validated base controller and costmaps unchanged.  Dynamic actors
# remain visible to the shared RGB-D VoxelLayer and the independent LiDAR
# ObstacleLayer; hard footprint collision checking, Collision Monitor and the
# actor clearance guard remain authoritative safety layers.

controller_server:
  ros__parameters:
    # Profiles must declare a complete MPPI timing tuple for the pre-launch
    # Jazzy timing contract.  Repeat only the validated base timing budget;
    # all control/noise/critic limits inherit from the base file.
    controller_frequency: 10.0
    FollowPath:
      time_steps: 20
      model_dt: 0.10
      batch_size: 700

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: [obstacle_layer, depth_voxel_layer, inflation_layer]
      obstacle_layer:
        scan:
          raytrace_min_range: 0.05
          inf_is_valid: false

global_costmap:
  global_costmap:
    ros__parameters:
      # A front-camera VoxelLayer cannot clear an actor after it leaves the
      # global field of view.  Keep dynamic RGB-D local; the global planner
      # uses the static map plus independently clearing LiDAR observations.
      plugins: [static_layer, obstacle_layer, inflation_layer]
      obstacle_layer:
        scan:
          raytrace_min_range: 0.40
          inf_is_valid: false

behavior_server:
  ros__parameters:
    # Dynamic runs must never issue the shared dead-end-recovery BackUp command
    # without checking its swept costmap footprint.  This affects only the
    # recovery behavior; normal MPPI commands and actor geometry are unchanged.
    simulate_ahead_time: 1.0
