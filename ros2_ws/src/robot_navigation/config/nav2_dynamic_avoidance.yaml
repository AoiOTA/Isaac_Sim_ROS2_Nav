# Overlay used only by the reproducible Kujiale dynamic-obstacle experiments.
#
# Keep RGB-D fusion enabled, but use a *temporal* voxel representation for the
# dynamic benchmark.  Nav2's built-in VoxelLayer only removes a marked cell
# when a later depth ray revisits it.  With a front-only camera, an actor that
# has left the field of view can therefore leave a trail indefinitely.  STVL
# keeps the same PointCloud2 input while expiring unobserved voxels and
# accelerating that expiration inside the current camera frustum.
#
# LiDAR remains an independent 2D obstacle layer.  The exact whole-house
# no-actor diagnostic proved that the former 15 Hz / 30-step, high-noise MPPI
# envelope plus 0.75 m local inflation failed the static G2->G3 junction.  A
# dynamic profile must not close control space that is physically traversable.
# Inherit the validated base MPPI, footprint-aware CostCritic, 0.40 m soft
# inflation and velocity smoother.  Dynamic safety remains in temporal STVL,
# LiDAR clearing, hard footprint collision checking, Collision Monitor, the
# actor clearance guard and the dynamic-only BackUp look-ahead below.
controller_server:
  ros__parameters:
    # Profiles must declare a complete MPPI timing tuple for the pre-launch
    # Jazzy timing contract.  Repeat only the validated base timing budget;
    # all control/noise/critic limits continue to inherit from the base file.
    controller_frequency: 10.0
    FollowPath:
      time_steps: 20
      model_dt: 0.10
      batch_size: 700

local_costmap:
  local_costmap:
    ros__parameters:
      # The RGB-D and LiDAR inputs provide new frames at roughly 6--8 Hz in
      # the loaded Isaac scene.  A 20 Hz costmap only recomputed the same STVL
      # observations and contended with the 20 Hz MPPI loop in this shared
      # controller_server process.  Ten updates per second still consumes the
      # next sensor frame within 0.10 s while leaving a deterministic MPPI
      # compute window; publish at 5 Hz to avoid redundant full-grid RViz I/O.
      update_frequency: 10.0
      publish_frequency: 5.0
      plugins: [obstacle_layer, depth_stvl_layer, inflation_layer]
      obstacle_layer:
        enabled: true
        observation_sources: scan
        scan:
          clearing: true
          marking: true
          data_type: LaserScan
          observation_persistence: 0.0
          inf_is_valid: true
          raytrace_min_range: 0.0
          raytrace_max_range: 25.0
          # /scan_safety has already removed the padded robot envelope, so the
          # local controller may retain obstacle returns throughout the
          # footprint-adjacent safety shell.
          obstacle_min_range: 0.05
          obstacle_max_range: 25.0
      # STVL is a drop-in Costmap2D voxel plugin.  It consumes the same RGB-D
      # PointCloud2 as the base VoxelLayer but tracks an age per voxel.
      depth_stvl_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        # Linear decay gives a bounded lifetime even after the actor exits the
        # front camera FOV.  The companion clearing source below accelerates
        # decay within the visible frustum, so a departed box is normally gone
        # in the next few RGB-D frames rather than after the full 0.75 s.
        voxel_decay: 0.75
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.10
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: camera_depth_mark camera_depth_clear

        camera_depth_mark:
          data_type: PointCloud2
          topic: /camera/front/depth/points
          marking: true
          clearing: false
          obstacle_range: 2.0
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          expected_update_rate: 0.0
          observation_persistence: 0.0
          # The 320x180 RGB-D cloud is dense.  This retains one observation
          # per 5 cm voxel without reducing the collision geometry.
          filter: voxel
          voxel_min_points: 0
          clear_after_reading: true

        camera_depth_clear:
          data_type: PointCloud2
          topic: /camera/front/depth/points
          marking: false
          clearing: true
          # Camera optical depth range and calibrated perspective FOV.
          min_z: 0.05
          max_z: 2.5
          vertical_fov_angle: 1.272
          horizontal_fov_angle: 1.839
          # A high frustum decay rate removes cells that should have been
          # observed in the current frame but were not (e.g. a moved actor).
          decay_acceleration: 15.0
          model_type: 0

global_costmap:
  global_costmap:
    ros__parameters:
      # The common base profile includes global RGB-D for static low boxes.
      # A moving actor must not be retained there, so dynamic runs keep the
      # static map plus LiDAR and use only the rolling local STVL for depth.
      plugins: [static_layer, obstacle_layer, inflation_layer]
      obstacle_layer:
        enabled: true
        observation_sources: scan
        scan:
          clearing: true
          marking: true
          data_type: LaserScan
          observation_persistence: 0.0
          inf_is_valid: true
          raytrace_min_range: 0.0
          raytrace_max_range: 25.0
          obstacle_min_range: 0.40
          obstacle_max_range: 25.0

behavior_server:
  ros__parameters:
    # v25 G2 safety repair: dynamic runs must never issue the shared
    # dead-end-recovery BackUp command without a costmap look-ahead.  The v24
    # physical-contact evidence latched while the robot was reversing at
    # -0.18 m/s after the dynamic actor had already parked elsewhere.  Keep
    # the base profile's 0.0 setting for its validated narrow static passage,
    # but make BackUp predict one second of the reverse sweep here.  A blocked
    # recovery returns failure to the existing RoundRobin, which can Spin,
    # Wait, and replan; it must not blindly reverse into an occupied cell.
    # This does not change any actor geometry, trajectory, Collision Monitor,
    # physical-contact criterion, or normal MPPI tracking command.
    simulate_ahead_time: 1.0
