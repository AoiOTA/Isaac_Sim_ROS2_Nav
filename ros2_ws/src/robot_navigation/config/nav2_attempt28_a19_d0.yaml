# Attempt28 A19 diagnostic D0 delta.  The stock MPPI budget is retained;
# A19 also requires exact through-pose cells so the planner cannot substitute
# a wall-adjacent cell for a frozen footprint-feasible tube waypoint.
planner_server:
  ros__parameters:
    GridBased:
      tolerance: 0.0

# The complete A19 portal slice and padded footprint must be represented by
# the rolling local costmap before FollowPath is dispatched.  A 4.0 m window
# clipped the immutable portal-122 slice by 45.5 mm in local Y while the robot
# was stationary. Nav2 declares window dimensions as integer metres, so keep
# X at 4 m and extend Y to the next valid size, 5 m.
"/local_costmap/local_costmap":
  ros__parameters:
    width: 4
    height: 5

controller_server:
  ros__parameters:
    failure_tolerance: 0.3
    publish_zero_velocity: true
    controller_plugins: [FollowPath]
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker, a19_crossing_goal_checker]
    a19_crossing_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.141592654
