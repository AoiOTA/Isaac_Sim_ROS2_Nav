# C4 isolation overlay: preserve RGB-D publication for Module1/2 and evidence,
# but do not let raw depth points write either Nav2 Costmap directly.
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    FollowPath:
      time_steps: 20
      model_dt: 0.10
      batch_size: 700
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - VelocityDeadbandCritic
        - CognitiveRiskCritic
      CognitiveRiskCritic:
        enabled: true
        mode: active
        obstacle_topic: /bio_nav/module2/cognitive_obstacles
        planning_prior_topic: /bio_nav/module2/planning_prior
        maximum_age_s: 0.5
        maximum_ood_probability: 0.2
        obstacle_weight: 4.0
        direction_weight: 1.0
        novelty_weight: 0.5
        uncertainty_weight: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: [obstacle_layer, cognitive_obstacle_layer, inflation_layer]
      # Margin reverted to the base 0.40 m inflation / 0.005 m footprint
      # padding (fd01d0ac's 0.55 / 0.03 removed).  Offline bag analysis of
      # the R5 live runs showed the widened inflation was the run#4 failure
      # driver: MPPI forward cost rose ~4x and the reverse-start deadlocked
      # in the G1 exit corridor (padding had no measurable effect).  The
      # run#2 G2->G3 door-corner contact was localization-side: AMCL drift
      # was 0.24--0.25 m at contact versus a 0.125 m door-zone absorbable
      # limit (run#1 drift <=0.1 m passed on plan/route that were centered),
      # so no feasible costmap margin can absorb it; drift is being
      # addressed on the AMCL side (amcl_kujiale.yaml).  cost_scaling_factor
      # stays at the base 9.0.
      # Evidence: /mnt/nas_home/Bio_Nav_Data/experiments/analysis/v6_r5_margin_rootcause_20260822/
      depth_voxel_layer:
        enabled: false
      cognitive_obstacle_layer:
        plugin: bio_nav_fusion::CognitiveObstacleLayer
        enabled: true
        mode: active
        maximum_age_s: 0.5
        maximum_ood_probability: 0.2
        maximum_soft_cost: 80
        collision_min_height_m: 0.02
        collision_max_height_m: 0.45

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: [static_layer, obstacle_layer, cognitive_obstacle_layer, inflation_layer]
      # Base margin restored on the global side too; see the local_costmap
      # comment above for the run#2/run#4 evidence.
      depth_voxel_layer:
        enabled: false
      cognitive_obstacle_layer:
        plugin: bio_nav_fusion::CognitiveObstacleLayer
        enabled: true
        mode: active
        maximum_age_s: 0.5
        maximum_ood_probability: 0.2
        maximum_soft_cost: 80
        collision_min_height_m: 0.02
        collision_max_height_m: 0.45
