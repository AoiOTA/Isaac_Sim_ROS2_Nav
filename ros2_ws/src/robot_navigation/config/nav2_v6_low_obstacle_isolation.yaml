# C4 isolation overlay: preserve RGB-D publication for Module1/2 and evidence,
# but do not let raw depth points write either Nav2 Costmap directly.
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    FollowPath:
      time_steps: 20
      model_dt: 0.10
      batch_size: 700
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - VelocityDeadbandCritic
        - CognitiveRiskCritic
      CognitiveRiskCritic:
        enabled: true
        mode: active
        obstacle_topic: /bio_nav/module2/cognitive_obstacles
        planning_prior_topic: /bio_nav/module2/planning_prior
        maximum_age_s: 0.5
        maximum_ood_probability: 0.2
        obstacle_weight: 4.0
        direction_weight: 1.0
        novelty_weight: 0.5
        uncertainty_weight: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: [obstacle_layer, cognitive_obstacle_layer, inflation_layer]
      # V6 Phase-1 rerun (seed 7201): leg G2->G3 clipped the mapped
      # door-corner cabinet_0003 at (-0.60, 3.17) with 0.20--0.25 m AMCL-GT
      # error.  The base 0.40 m inflation / 0.005 m footprint padding leaves
      # no room for that estimated-localization noise, so widen only this
      # profile's margin.  cost_scaling_factor stays at the base 9.0.
      footprint_padding: 0.03
      depth_voxel_layer:
        enabled: false
      cognitive_obstacle_layer:
        plugin: bio_nav_fusion::CognitiveObstacleLayer
        enabled: true
        mode: active
        maximum_age_s: 0.5
        maximum_ood_probability: 0.2
        maximum_soft_cost: 80
        collision_min_height_m: 0.02
        collision_max_height_m: 0.45
      inflation_layer:
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: [static_layer, obstacle_layer, cognitive_obstacle_layer, inflation_layer]
      # Same estimated-localization margin as the local side.
      footprint_padding: 0.03
      depth_voxel_layer:
        enabled: false
      cognitive_obstacle_layer:
        plugin: bio_nav_fusion::CognitiveObstacleLayer
        enabled: true
        mode: active
        maximum_age_s: 0.5
        maximum_ood_probability: 0.2
        maximum_soft_cost: 80
        collision_min_height_m: 0.02
        collision_max_height_m: 0.45
      inflation_layer:
        inflation_radius: 0.55
