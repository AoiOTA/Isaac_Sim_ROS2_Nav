# Attempt-23 global-prior-only profile.
#
# Module2 guidance is a pure global planning prior in Attempt-23; local
# obstacle avoidance is entirely stock Nav2, and Module3 no longer
# subscribes to any /bio_nav/module2/* risk topic.  This overlay starts
# from nav2_attempt22_reachability_shadow.yaml, which keeps the read-only
# ReachabilityObserverLayer snapshot and the stock SmacPlanner2D global
# side, and merges the validated dynamic envelope from
# nav2_dynamic_avoidance.yaml: the 15 Hz / 30-step MPPI budget with the
# widened control envelope and CostCritic tuning, the STVL depth layer
# with a 0.75 m inflation envelope in the local costmap, a
# dynamic-residue-free global costmap, behavior simulate_ahead_time 1.0,
# and the velocity-smoother envelope.  The deleted PredictiveRiskCritic is
# removed from the MPPI critics.  The Collision Monitor keeps the base
# StopZone and SlowdownZone and enables the stock ApproachZone predictive
# footprint projection as the only Module3 look-ahead layer.
controller_server:
  ros__parameters:
    # Fifteen hertz with 30 steps is the measured sustainable MPPI cadence
    # on the complete Isaac + STVL + RViz workload (see
    # nav2_dynamic_avoidance.yaml for the full timing evidence).
    controller_frequency: 15.0
    FollowPath:
      # Preserve the complete two-second look-ahead and sequence shifting at
      # the measured sustainable controller period.
      time_steps: 30
      model_dt: 0.0666666667
      batch_size: 500
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic

      # Dynamic evasive envelope from nav2_dynamic_avoidance.yaml.
      vx_std: 0.90
      wz_std: 3.40
      vx_max: 1.20
      wz_max: 3.40
      ax_max: 3.50
      ax_min: -3.50
      az_max: 6.50
      gamma: 0.030
      TrajectoryVisualizer:
        trajectory_step: 25
        time_step: 5
      CostCritic:
        # With the 9.0 inflation decay, near_collision_cost 20 is reached
        # roughly 0.50 m from a lethal actor cell: just outside the 0.33 m
        # circumscribed robot bound plus the actor guard's 0.14 m clearance.
        # Hard footprint collision checking stays unchanged from the base
        # configuration (consider_footprint: true).
        near_collision_cost: 20
        cost_weight: 4.00
      PathFollowCritic:
        cost_weight: 14.0

local_costmap:
  local_costmap:
    ros__parameters:
      # Ten updates per second consumes the next 6--8 Hz RGB-D/LiDAR frame
      # within 0.10 s while leaving a deterministic MPPI compute window;
      # publish at 5 Hz to avoid redundant full-grid RViz I/O.
      update_frequency: 10.0
      publish_frequency: 5.0
      plugins: [obstacle_layer, depth_stvl_layer, inflation_layer]
      obstacle_layer:
        enabled: true
        observation_sources: scan
        scan:
          clearing: true
          marking: true
          data_type: LaserScan
          observation_persistence: 0.0
          inf_is_valid: true
          raytrace_min_range: 0.0
          raytrace_max_range: 25.0
          # /scan_safety has already removed the padded robot envelope, so the
          # local controller may retain obstacle returns throughout the
          # footprint-adjacent safety shell.
          obstacle_min_range: 0.05
          obstacle_max_range: 25.0
      inflation_layer:
        # 0.75 m dynamic envelope so the 15 Hz controller receives a
        # meaningful gradient before the >=0.10 m acceptance boundary.  The
        # physical footprint and hard collision test remain unchanged.
        inflation_radius: 0.75
      # STVL is a drop-in Costmap2D voxel plugin.  It consumes the same RGB-D
      # PointCloud2 as the base VoxelLayer but tracks an age per voxel, so a
      # departed actor expires instead of leaving an indefinite trail.
      depth_stvl_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        # Linear decay gives a bounded lifetime even after the actor exits the
        # front camera FOV.  The companion clearing source below accelerates
        # decay within the visible frustum, so a departed box is normally gone
        # in the next few RGB-D frames rather than after the full 0.75 s.
        voxel_decay: 0.75
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.10
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: camera_depth_mark camera_depth_clear

        camera_depth_mark:
          data_type: PointCloud2
          topic: /camera/front/depth/points
          marking: true
          clearing: false
          obstacle_range: 2.0
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          expected_update_rate: 0.0
          observation_persistence: 0.0
          # The 320x180 RGB-D cloud is dense.  This retains one observation
          # per 5 cm voxel without reducing the collision geometry.
          filter: voxel
          voxel_min_points: 0
          clear_after_reading: true

        camera_depth_clear:
          data_type: PointCloud2
          topic: /camera/front/depth/points
          marking: false
          clearing: true
          # Camera optical depth range and calibrated perspective FOV.
          min_z: 0.05
          max_z: 2.5
          vertical_fov_angle: 1.272
          horizontal_fov_angle: 1.839
          # A high frustum decay rate removes cells that should have been
          # observed in the current frame but were not (e.g. a moved actor).
          decay_acceleration: 15.0
          model_type: 0

global_costmap:
  global_costmap:
    ros__parameters:
      # A moving actor must not be retained in the global costmap, so the
      # depth voxel layer is dropped here; the rolling local STVL carries
      # depth.  The ReachabilityObserverLayer stays as the read-only global
      # prior snapshot for the Integration sidecar.
      plugins:
        - static_layer
        - obstacle_layer
        - reachability_observer_layer
        - inflation_layer
      reachability_observer_layer:
        plugin: bio_nav_fusion::ReachabilityObserverLayer
        enabled: true
        output_topic: /global_costmap/reachability_observer_input

planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased:
      # The Module3 global planner remains the stock SmacPlanner2D; Module2
      # guidance enters only as a global prior, never as a local override.
      plugin: nav2_smac_planner::SmacPlanner2D

behavior_server:
  ros__parameters:
    # Dynamic runs must never issue the shared dead-end-recovery BackUp
    # command without a costmap look-ahead: BackUp predicts one second of
    # the reverse sweep, and a blocked recovery returns failure to the
    # existing RoundRobin, which can Spin, Wait, and replan.
    simulate_ahead_time: 1.0

velocity_smoother:
  ros__parameters:
    # Keep the faster dynamic envelope independent from the historical static
    # profile, while emitting bounded commands on Isaac's 60 Hz physics tick.
    smoothing_frequency: 60.0
    max_velocity: [1.20, 0.0, 3.40]
    min_velocity: [-0.25, 0.0, -3.40]
    max_accel: [3.50, 0.0, 6.50]
    max_decel: [-3.50, 0.0, -6.50]
    feedback: OPEN_LOOP

collision_monitor:
  ros__parameters:
    # Attempt-23 enables the stock ApproachZone predictive footprint
    # projection as the only Module3 look-ahead layer.  StopZone and
    # SlowdownZone remain unchanged from the base nav2_params.yaml and stay
    # the final LiDAR safety layers.
    ApproachZone:
      enabled: true
