[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-sim-ros2-nav"
version = "0.1.0"
description = "Engineering tools for the Isaac Sim and ROS 2 navigation workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
minversion = "7.4"
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
testpaths = [
  "isaac_sim/tests",
  "ros2_ws/src",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [
  ".git",
  ".venv",
  "build",
  "install",
  "log",
]
markers = [
  "unit: tests that do not require Isaac Sim or a running ROS graph",
  "integration: tests spanning more than one project component",
  "isaac: tests that must run with the Isaac Sim Python environment",
  "ros: tests that require ROS 2 packages or a running ROS graph",
]
