schema_version: 1
asset_root: ${ISAAC_ASSET_ROOT}

environment:
  project_stage: ${PROJECT_ROOT}/isaac_sim/assets/environments/navigation_scene.usda
  source_asset: ${ISAAC_ASSET_ROOT}/Isaac/Environments/Simple_Warehouse/warehouse_multiple_shelves.usd
  composition: sublayer

robot:
  asset_path: ${PROJECT_ROOT}/isaac_sim/assets/robots/jackal/jackal_nav.usda
  default_prim: jackal
  runtime_prim_path: /World/Robots/Jackal
  articulation_root: /World/Robots/Jackal
  base_link_prim: /World/Robots/Jackal/base_link
  wheel_joints:
    - front_left_wheel_joint
    - front_right_wheel_joint
    - rear_left_wheel_joint
    - rear_right_wheel_joint
  front_wheel_joints: [front_left_wheel_joint, front_right_wheel_joint]
  rear_wheel_joints: [rear_left_wheel_joint, rear_right_wheel_joint]

simulation:
  physics_hz: 60
  rendering_hz: 60
  expected_physics_scene: /PhysicsScene
  headless: false
  renderer: RaytracedLighting
  navigation_mode: mapping
  odometry_mode: ideal
  structure_tf_source: isaac
  pacing_mode: realtime
  target_realtime_factor: 1.0
  max_frames: 0
  # First-run RTX shader/PSO compilation can block a Kit update for minutes.
  stage_readiness_timeout_s: 420

spawn:
  poses_file: ${PROJECT_ROOT}/isaac_sim/configs/spawn_poses.yaml
  selected: mapping_start

ros2:
  domain_id: 42
  rmw_implementation: rmw_fastrtps_cpp
  namespace: ""

# Map-frame Ground Truth stays opt-in. Enabling it still requires a calibrated
# named spawn pose and fails before publishers start when calibration is absent.
ground_truth:
  enabled: false
  frame_id: map
  child_frame_id: ground_truth_base_link
  odom_topic: /ground_truth/odom
  path_topic: /ground_truth/path
  odom_hz: 60
  path_hz: 10

# GUI runs automatically bind the main Isaac viewport to this camera. It is a
# child of base_link, so the robot's transform and Reset are inherited without
# per-frame tracking. Headless runs skip it and keep their existing cost.
third_person_camera:
  enabled: true
  prim_name: third_person_camera
  # Indoor-safe chase view: below a normal ceiling, far/high enough to keep
  # Jackal and the next doorway or bend in frame.
  distance_m: 3.2
  height_m: 2.2
  look_ahead_m: 1.0
  look_at_height_m: 0.25
  focal_length_mm: 16.0

extensions:
  - isaacsim.core.nodes
  - isaacsim.robot.wheeled_robots.nodes
  - isaacsim.ros2.bridge
  - isaacsim.ros2.nodes
  - isaacsim.sensors.experimental.physics
  - isaacsim.sensors.physics.nodes
  - isaacsim.sensors.experimental.rtx

files:
  robot: ${PROJECT_ROOT}/isaac_sim/configs/robots/jackal.yaml
  lidar: ${PROJECT_ROOT}/isaac_sim/configs/sensors/lidar_3d.yaml
  imu: ${PROJECT_ROOT}/isaac_sim/configs/sensors/imu.yaml
  camera: ${PROJECT_ROOT}/isaac_sim/configs/sensors/camera.yaml
  topics: ${PROJECT_ROOT}/isaac_sim/configs/ros2_bridge/topics.yaml
  qos: ${PROJECT_ROOT}/isaac_sim/configs/ros2_bridge/qos.yaml
  dynamic_obstacles: ${PROJECT_ROOT}/isaac_sim/configs/experiments/dynamic.yaml
