# Engineering-only causal-benefit stressor for V4 query Q36_51.
#
# The static map and every GVG branch remain unchanged and footprint-feasible.
# This actor is visible and moving before the initial branch decision so DR can
# affect routing, while the central SR route never intersects its motion band.
# It makes a finite set of crossings in the open, footprint-passable outer
# branch, then retires.  Five timing variants cover the measured arrival window
# without changing the static geometry or permanently blocking the branch.
