schema_version: 3
enabled: true
default_profile: monitoring
primary_camera: front

profiles:
  "off":
    enabled: false
  monitoring:
    enabled: true
    width: 640
    height: 360
    publish_rate_hz: 15.0
  standard:
    enabled: true
    width: 640
    height: 480
    publish_rate_hz: 20.0
  high_quality:
    enabled: true
    width: 1280
    height: 720
    publish_rate_hz: 30.0

cameras:
  front:
    enabled: true
    sensor_prim: /World/Robots/Jackal/base_link/camera_link/camera_front_link/camera_front_optical_frame/camera_front_sensor
    link_frame: camera_front_link
    optical_frame: camera_front_optical_frame
    node_namespace: /camera/front
    rgb:
      enabled: true
      topic_name: image_raw
      encoding: rgb8
      qos_profile: camera_sensor_data
      queue_size: 2
    camera_info:
      enabled: true
      topic_name: camera_info
      qos_profile: camera_sensor_data
      queue_size: 2
    depth:
      enabled: false
      topic_name: depth/image_raw
      qos_profile: camera_sensor_data
      queue_size: 1
    clipping_range_m:
      near: 0.05
      far: 100.0
    optics:
      projection: perspective
      focal_length_mm: 24.0
      horizontal_aperture_mm: 21.0
      vertical_aperture_mode: match_profile_aspect_ratio
      focus_distance_m: 4.0
      # 0.0 keeps the machine-vision camera pinhole-sharp; exposure f-stop is
      # configured independently below.
      f_stop: 0.0
    exposure:
      enabled: true
      auto_exposure_enabled: false
      time_s: 0.02
      responsivity: 1.10267
      f_stop: 5.0
    render_product:
      # These settings are authored only on CameraFront's RenderProduct. They
      # do not change the interactive viewport's global renderer settings.
      anti_aliasing: rtxaa
      motion_blur_enabled: false
      depth_of_field_enabled: false
    rviz:
      enabled: true
      transport: raw
      reliability: best_effort
      queue_size: 2
