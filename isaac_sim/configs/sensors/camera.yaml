schema_version: 3
enabled: true
default_profile: monitoring
primary_camera: front

profiles:
  "off":
    enabled: false
    depth_points_enabled: false
  monitoring:
    enabled: true
    width: 640
    height: 360
    publish_rate_hz: 15.0
    depth_points_enabled: false
  standard:
    enabled: true
    width: 640
    height: 480
    publish_rate_hz: 20.0
    depth_points_enabled: false
  high_quality:
    enabled: true
    width: 1280
    height: 720
    publish_rate_hz: 30.0
    depth_points_enabled: false
  rgbd_navigation:
    enabled: true
    width: 320
    height: 180
    publish_rate_hz: 10.0
    depth_points_enabled: true

cameras:
  front:
    enabled: true
    sensor_prim: /World/Robots/Jackal/base_link/camera_link/camera_front_link/camera_front_optical_frame/camera_front_sensor
    link_frame: camera_front_link
    optical_frame: camera_front_optical_frame
    node_namespace: /camera/front
    rgb:
      enabled: true
      topic_name: image_raw
      encoding: rgb8
      qos_profile: camera_sensor_data
      queue_size: 2
    camera_info:
      enabled: true
      topic_name: camera_info
      qos_profile: camera_sensor_data
      queue_size: 2
    depth:
      # Keep the raw depth stream alongside the point cloud.  The point cloud
      # feeds Nav2's VoxelLayer; the image is retained as RGB-D evidence for
      # the low-obstacle Pilot and failed-run artifacts.
      enabled: true
      topic_name: depth/image_raw
      qos_profile: camera_sensor_data
      queue_size: 2
    depth_points:
      enabled: true
      topic_name: depth/points
      qos_profile: camera_sensor_data
      queue_size: 2
    clipping_range_m:
      near: 0.05
      far: 100.0
    optics:
      projection: perspective
      # The low RGB-D validation box starts lateral to the robot's initial
      # heading.  A ~105 degree horizontal FOV observes it while turning to
      # G1, before the local controller reaches the collision envelope.
      focal_length_mm: 8.0
      horizontal_aperture_mm: 21.0
      vertical_aperture_mode: match_profile_aspect_ratio
      focus_distance_m: 4.0
    exposure:
      enabled: true
      time_s: 0.02
      responsivity: 1.10267
      f_stop: 5.0
    rviz:
      enabled: true
      transport: raw
      reliability: best_effort
      queue_size: 2
