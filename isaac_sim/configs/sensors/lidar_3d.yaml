schema_version: 1
enabled: true
sensor_prim: /World/Robots/Jackal/base_link/lidar_link/rtx_lidar
config: RPLIDAR_S2E
variant: null
# RTX rotary lidar assets scan in their local X-Z plane. Rotate the internal
# sensor about X so the navigation scan lies in the robot's horizontal X-Y
# plane. Quaternion order is wxyz.
scan_plane_rotation_wxyz: [0.7071067811865476, 0.7071067811865475, 0.0, 0.0]
# Keep the obstacle-observation cadence aligned with the 20 Hz MPPI and
# local-costmap chain, so a newly visible actor is considered on the next
# control cycle rather than after a 100 ms sensor period.
tick_rate: 20.0
accumulate_outputs: true
render_product_resolution: [1, 1]
topic_name: /lidar/points_raw
frame_id: rtx_world
# Isaac Sim 6.0.1's RTX PointCloud writer publishes absolute USD-world
# coordinates. Label them with the explicit fixed data frame; a spawn-derived
# odom -> rtx_world transform converts them into the ROS navigation tree.
output_frame: WORLD
# A full rotary scan spans one sensor period. Compensate returns into one
# sensor pose so simultaneous translation and rotation do not bend walls.
motion_compensation: COMPENSATED
type: point_cloud
qos_profile: sensor_data

# Optional 3D LiDAR producer for the FAST-LIO2 shadow path.  The profile is
# the single activation switch: "off" authors no sensor, Render Product, or
# OmniGraph.  The existing RPLIDAR_S2E configuration above is independent.
lio:
  default_profile: "off"
  supported_profile: OS1_REV6_32ch10hz512res
  sensor_prim: /World/Robots/Jackal/base_link/lio_lidar_link/rtx_lidar
  config: OS1
  variant: OS1_REV6_32ch10hz512res
  tick_rate: 10.0
  accumulate_outputs: true
  render_product_resolution: [1, 1]
  channels: 32
  horizontal_resolution: 512
  range_m: [0.3, 120.0]
  topic_name: /lio/points_raw_isaac
  frame_id: lio_lidar_link
  output_frame: SENSOR
  motion_compensation: NONCOMPENSATED
  type: point_cloud
  qos_profile: sensor_data
  output_intensity: true
  output_timestamp: true
  output_channel_id: true
