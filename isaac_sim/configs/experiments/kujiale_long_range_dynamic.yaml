# Schema v2 is the physical-obstacle contract for the Kujiale campaign.
# Coordinates are Map coordinates and are transformed with long_route_start_g1.
schema_version: 2
seed: 7301
enabled: false
coordinate_frame: map
spawn_pose_name: long_route_start_g1
obstacles:
  # G2 acceptance occurs at the beginning of the G1->G2 leg.  Each actor
  # enters that leg's centre corridor from a side clearance, then holds in
  # the travel lane before the robot reaches its row.  This forces a real
  # slow-down/wait/replan or detour without spawning against the robot.
  - {id: g1_g2_south_crossing, mode: linear, trigger_group: G2, size: [0.40, 0.40, 1.00], mass: 20.0, start: [1.15, -1.00, 0.50], end: [0.45, -1.00, 0.50], speed: 0.10, delay_sec: 6.0, jitter_sec: 0.25, post_motion: hold}
  - {id: g1_g2_north_crossing, mode: linear, trigger_group: G2, size: [0.40, 0.40, 1.00], mass: 20.0, start: [-0.20, 0.65, 0.50], end: [0.50, 0.65, 0.50], speed: 0.10, delay_sec: 15.0, jitter_sec: 0.25, post_motion: hold}
