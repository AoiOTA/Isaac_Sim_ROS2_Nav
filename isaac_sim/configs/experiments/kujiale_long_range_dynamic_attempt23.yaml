# Schema v4: calibrated single cases plus ordered full-route case sets.
# Every actor is a high LiDAR-visible 0.40 x 0.40 x 1.00 m kinematic cube.
# Goal acceptance only arms it. Motion is released once the robot crosses the
# spatial gate in the specified direction at >= 0.20 m/s.
#
# Attempt-23 variant: the same_direction_slow actor's speed is raised from
# 0.18 m/s to 0.32 m/s (the bottom of the envelope the local stack proved out
# in the v5 development data, 0.32-0.80 m/s).  The Global Shadow evidence
# showed the 0.18 m/s choreography deadlocks the corridor follow on this seed
# family (seeds 31704/31709), which the plan 4.6 qualification gate cannot
# absorb; tightening the actor speed envelope is the sanctioned remediation.
# The difficulty reduction is recorded in the Attempt-23 report.
schema_version: 4
seed: 7401
enabled: false
coordinate_frame: map
spawn_pose_name: long_route_start_g1
# The actor yields before the footprint acceptance threshold, never by
# disabling itself after it is already touching the robot.
safety: {guard_clearance_m: 0.14, min_clearance_m: 0.10}
cases:
  crossing:
    trigger_group: G2
    # At -1.80 m the measured time-to-conflict was only ~2.1 s, equal to
    # the MPPI horizon. Trigger earlier so perception and braking are testable.
    gate: {axis: y, threshold: -2.80, direction: positive, min_speed_mps: 0.20, x_range: [-0.60, 0.40]}
    obstacle:
      {id: crossing_actor, size: [0.40, 0.40, 1.00], mass: 20.0, waypoints: [[0.70, 0.00, 0.50], [-0.85, 0.00, 0.50], [-1.20, 0.00, 0.50]], speed: 0.45, max_acceleration: 0.75, post_motion: park}
    variants:
      v1: {seed: 7401, start_delay_sec: 0.00}
      v2: {seed: 7402, start_delay_sec: 0.15}
      v3: {seed: 7403, start_delay_sec: 0.30}
      v4: {seed: 7404, start_delay_sec: 0.45}
      v5: {seed: 7405, start_delay_sec: 0.60}
  oncoming:
    trigger_group: G2
    gate: {axis: y, threshold: -1.80, direction: positive, min_speed_mps: 0.20, x_range: [-0.60, 0.40]}
    obstacle:
      {id: oncoming_actor, size: [0.40, 0.40, 1.00], mass: 20.0, waypoints: [[0.70, 0.80, 0.50], [-0.10, 0.50, 0.50], [-0.10, -1.20, 0.50]], speed: 0.40, max_acceleration: 0.75, post_motion: park}
    variants:
      v1: {seed: 7411, start_delay_sec: 0.00}
      v2: {seed: 7412, start_delay_sec: 0.15}
      v3: {seed: 7413, start_delay_sec: 0.30}
      v4: {seed: 7414, start_delay_sec: 0.45}
      v5: {seed: 7415, start_delay_sec: 0.60}
  same_direction_slow:
    trigger_group: G2
    # Overtaking case: the actor starts 3.5 m ahead of the spatial gate in
    # the open hall, then moves aside before the y >= 1.0 m bottleneck.  A
    # 0.45 m footprint blocks the nominal line and requires a real left-side
    # bypass, without turning the narrow passage into an impossible deadlock.
    gate: {axis: y, threshold: -3.60, direction: positive, min_speed_mps: 0.20, x_range: [-0.60, 0.40]}
    obstacle:
      {id: same_direction_slow_actor, size: [0.45, 0.45, 1.00], mass: 20.0, waypoints: [[-0.35, -0.10, 0.50], [-0.35, 0.65, 0.50], [0.45, 0.65, 0.50], [0.45, -0.55, 0.50]], speed: 0.32, max_acceleration: 0.50, post_motion: park}
    variants:
      v1: {seed: 7421, start_delay_sec: 0.00}
      v2: {seed: 7422, start_delay_sec: 0.15}
      v3: {seed: 7423, start_delay_sec: 0.30}
      v4: {seed: 7424, start_delay_sec: 0.45}
      v5: {seed: 7425, start_delay_sec: 0.60}
  local_bypass:
    trigger_group: G2
    # Start while the robot is still approaching the open hall.  The actor
    # Traverses right to the planned bypass point, then parks there.  This
    # deliberately produces a moving-to-parked interaction: the robot must
    # route around the parked actor rather than wait for a safety-yield.
    # The recorded G2 safety smoke proved that the former doorway gate
    # y=-1.75 armed too late: the kinematic actor entered safety_yield while
    # the robot was already committed to the same swept arc.  Arm at y=-2.60
    # in the same northbound lane so this unchanged 0.70 m trajectory reaches
    # its existing parking point before the robot enters the near field.
    gate: {axis: y, threshold: -2.60, direction: positive, min_speed_mps: 0.20, x_range: [-0.70, 0.30]}
    obstacle:
      # y=-0.20 keeps the complete 0.40 m box and its 0.05 m map clearance
      # below the y≈+0.10 static occupied band; a kinematic actor must never
      # sweep through that wall.
      # This is the verified smooth-interaction trajectory: the actor clears
      # the robot's near-field while leaving enough time for a continuous
      # right-side arc instead of forcing late high-curvature corrections.
      {id: local_bypass_actor, size: [0.40, 0.40, 1.00], mass: 20.0, waypoints: [[-1.65, -0.20, 0.50], [-0.95, -0.20, 0.50]], speed: 0.80, max_acceleration: 1.60, post_motion: park}
    variants:
      v1: {seed: 7441, start_delay_sec: 0.00}
      v2: {seed: 7442, start_delay_sec: 0.05}
      v3: {seed: 7443, start_delay_sec: 0.00}
      v4: {seed: 7444, start_delay_sec: 0.10}
      v5: {seed: 7445, start_delay_sec: 0.15}
  g2_g3_exit:
    trigger_group: G3
    # Trigger only after the robot has entered the narrow southbound aisle.
    # The direct G2 calibrated spawn has the same map frame as the full route,
    # so y=2.60 is the shared physical gate in focused and full-route modes.
    # Keep the direction, lane, and speed constraints to prevent an early arm
    # while the robot is still turning into the aisle.
    gate: {axis: y, threshold: 2.60, direction: negative, min_speed_mps: 0.20, x_range: [-0.55, -0.25]}
    obstacle:
      {id: g2_g3_exit_actor, size: [0.40, 0.40, 1.00], mass: 20.0, waypoints: [[-0.40, 1.00, 0.50], [-0.40, -0.70, 0.50]], speed: 0.65, max_acceleration: 0.90, post_motion: park}
    variants:
      v1: {seed: 7461, start_delay_sec: 0.00}
      v2: {seed: 7462, start_delay_sec: 0.05}
      v3: {seed: 7463, start_delay_sec: 0.10}
      v4: {seed: 7464, start_delay_sec: 0.15}
      v5: {seed: 7465, start_delay_sec: 0.20}
  g5_g1_crossing:
    trigger_group: G1
    # G5->G1 first enters this area northbound, then turns south at the
    # doorway.  Trigger on that northbound ingress instead of the later
    # southbound exit, otherwise the hidden actor would appear at the robot.
    # The former 1.05 m start-distance gate was too late for this 3.44 s
    # smooth 0.70 m crossing: it yielded in the robot swept arc.  Arm at the
    # calibrated northbound ingress (y=-2.90, x≈-2.03) so the unchanged actor
    # finishes its visible traverse and park before the robot reaches it.
    gate: {axis: y, threshold: -2.90, direction: positive, min_speed_mps: 0.20, x_range: [-2.10, -0.15], max_distance_to_obstacle_start_m: 2.00}
    obstacle:
      # Shift the swept band 0.15 m out of the doorway (north) while retaining
      # a >= 0.05 m static-map margin for the 0.40 m actor footprint.
      {id: g5_g1_crossing_actor, size: [0.40, 0.40, 1.00], mass: 20.0, waypoints: [[-0.90, -1.30, 0.50], [-0.20, -1.30, 0.50]], speed: 0.32, max_acceleration: 1.60, post_motion: park}
    variants:
      v1: {seed: 7471, start_delay_sec: 0.00}
      v2: {seed: 7472, start_delay_sec: 0.05}
      v3: {seed: 7473, start_delay_sec: 0.10}
      v4: {seed: 7474, start_delay_sec: 0.15}
      v5: {seed: 7475, start_delay_sec: 0.20}
  temporary_block:
    trigger_group: G2
    gate: {axis: y, threshold: -1.80, direction: positive, min_speed_mps: 0.20, x_range: [-0.60, 0.40]}
    obstacle:
      {id: temporary_block_actor, size: [0.40, 0.40, 1.00], mass: 20.0, waypoints: [[0.95, 0.15, 0.50], [-0.10, 0.15, 0.50], [0.95, 0.15, 0.50]], speed: 0.50, max_acceleration: 0.75, post_motion: park}
    variants:
      v1: {seed: 7431, dwell_sec: 0.60}
      v2: {seed: 7432, dwell_sec: 0.90}
      v3: {seed: 7433, dwell_sec: 1.20}
      v4: {seed: 7434, dwell_sec: 1.50}
      v5: {seed: 7435, dwell_sec: 1.80}
case_sets:
  # Exactly one actor is armed for each of G2, G3, and G1.  Goal completion
  # retires the preceding actor before the next goal is dispatched.
  full_route_three_stage: [local_bypass, g2_g3_exit, g5_g1_crossing]
