schema_version: 1
name: jackal

wheel_radius: 0.098
wheel_width: 0.040

# USDA 中真实几何轮距。
geometric_track_width: 0.37559
wheelbase: 0.262

base_mass: 17.0
wheel_mass: 0.477
nominal_total_mass: 18.908

physics:
  solver_position_iterations: 32
  solver_velocity_iterations: 4

  sleep_threshold: 0.005
  stabilization_threshold: 0.001

  # 这些是轮关节被动摩擦，不是轮胎与地面的接触摩擦。
  wheel_static_friction_effort: 0.0
  wheel_dynamic_friction_effort: 0.0
  wheel_viscous_friction_coefficient: 0.0

  idle_brake_command_timeout_sec: 0.25
  idle_brake_command_deadband: 0.001

  # PhysX 的各向同性轮地接触会让四轮滑移底盘在弧线中严重欠转并损失前向速度。
  # 四轮仍按差速目标转动；平面速度补偿让车体运动与 cmd_vel/MPPI 模型一致。
  motion_assist_enabled: true
  motion_assist_command_timeout_sec: 0.25
  # 这是物理误差修正带宽；正常命令斜率仍由 DifferentialController 和
  # Nav2 Velocity Smoother 的较低加速度限制负责。
  motion_assist_max_linear_acceleration: 6.0
  motion_assist_max_angular_acceleration: 30.0

wheel_joints:
  front_left: front_left_wheel_joint
  front_right: front_right_wheel_joint
  rear_left: rear_left_wheel_joint
  rear_right: rear_right_wheel_joint

controller:
  wheel_radius: 0.098

  # 与平面运动补偿联合标定的有效轮距。几何轮距仍用于 USD/URDF 轮心位置。
  # Realistic Wheel Odom 必须使用相同值，避免角速度估计和控制不一致。
  wheel_distance: 0.800

  max_linear_speed: 1.0
  max_angular_speed: 1.5
  max_wheel_speed: 15.0

  # Isaac 内层仅作为硬保护，不负责正常导航平滑。
  max_acceleration: 2.0
  max_deceleration: 3.0
  max_angular_acceleration: 6.0

frames:
  base: base_link
  lidar: lidar_link
  imu: imu_link
  camera: camera_link

static_transforms:
  - parent: base_link
    child: lidar_link
    translation: [0.120, 0.000, 0.333]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]

  - parent: base_link
    child: imu_link
    translation: [0.012, 0.002, 0.067]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]

  - parent: base_link
    child: camera_link
    translation: [0.247, 0.000, 0.218]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]

  - parent: camera_link
    child: camera_left_link
    translation: [0.0, 0.060, 0.0]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]

  - parent: camera_link
    child: camera_right_link
    translation: [0.0, -0.060, 0.0]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]

  - parent: camera_left_link
    child: camera_left_optical_frame
    translation: [0.0, 0.0, 0.0]
    rotation_xyzw: [-0.5, 0.5, -0.5, 0.5]

  - parent: camera_right_link
    child: camera_right_optical_frame
    translation: [0.0, 0.0, 0.0]
    rotation_xyzw: [-0.5, 0.5, -0.5, 0.5]

footprint:
  - [0.255, 0.210]
  - [0.255, -0.210]
  - [-0.230, -0.210]
  - [-0.230, 0.210]
