# Experimental effective-track candidate only.  It is a full schema-v3 copy
# so every runtime hashes one self-contained input.  Relative to the stable
# Jackal profile, only kinematics_profile_id, lifecycle, and
# effective_track_width differ.  The value rounds the clean contact-matrix
# corr=0.025/offset=0.04 equal-environment mean 1.0120214399292224 m; it is not
# a calibrated or accepted value, and this v1 file must never be edited in place.
schema_version: 3
name: jackal
kinematics_profile_id: jackal_etw_1p012_v1
lifecycle: experimental_candidate
wheel_radius: 0.098
wheel_width: 0.040
geometric_track_width: 0.37559
effective_track_width: 1.012
wheelbase: 0.262
base_mass: 17.0
wheel_mass: 0.477
nominal_total_mass: 18.908
mass_collision_profile: ../../robot_mass_profiles/legacy_default_sensor_density_v1.yaml
# Behavior-preserving migration guard, not a calibrated drive. The damping is
# the legacy USD value converted to SI; the two 1e9 limits replace prior
# unbounded values with explicit finite sentinels until isolated A/B acceptance.
wheel_velocity_drive:
  schema_version: 1
  profile_id: jackal_drive_legacy_finite_guard_v1
  drive_type: force
  stiffness_n_m_per_rad: 0.0
  damping_n_m_s_per_rad: 572957795.1308232
  max_effort_n_m: 1000000000.0
  max_joint_velocity_rad_s: 1000000000.0
physics:
  solver_position_iterations: 32
  solver_velocity_iterations: 4
  sleep_threshold: 0.005
  stabilization_threshold: 0.001
  wheel_static_friction_effort: 0.0
  wheel_dynamic_friction_effort: 0.0
  wheel_viscous_friction_coefficient: 0.0
  idle_brake_command_timeout_sec: 0.25
  idle_brake_command_deadband: 0.001
wheel_joints:
  front_left: front_left_wheel_joint
  front_right: front_right_wheel_joint
  rear_left: rear_left_wheel_joint
  rear_right: rear_right_wheel_joint
controller:
  max_linear_speed: 1.0
  max_angular_speed: 1.5
  max_wheel_speed: 15.0
  max_acceleration: 0.75
  max_deceleration: 1.0
  max_angular_acceleration: 2.0
frames:
  base: base_link
  lidar: lidar_link
  imu: imu_link
  camera: camera_link
static_transforms:
  - parent: base_link
    child: lidar_link
    translation: [0.120, 0.000, 0.333]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
  - parent: base_link
    child: imu_link
    translation: [0.012, 0.002, 0.067]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
  - parent: base_link
    child: camera_link
    translation: [0.247, 0.000, 0.218]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
  - parent: camera_link
    child: camera_front_link
    translation: [0.0, 0.0, 0.0]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
  - parent: camera_front_link
    child: camera_front_optical_frame
    translation: [0.0, 0.0, 0.0]
    rotation_xyzw: [-0.5, 0.5, -0.5, 0.5]
  - parent: camera_link
    child: camera_left_link
    translation: [0.0, 0.060, 0.0]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
  - parent: camera_link
    child: camera_right_link
    translation: [0.0, -0.060, 0.0]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
  - parent: camera_left_link
    child: camera_left_optical_frame
    translation: [0.0, 0.0, 0.0]
    rotation_xyzw: [-0.5, 0.5, -0.5, 0.5]
  - parent: camera_right_link
    child: camera_right_optical_frame
    translation: [0.0, 0.0, 0.0]
    rotation_xyzw: [-0.5, 0.5, -0.5, 0.5]
footprint:
  - [0.255, 0.210]
  - [0.255, -0.210]
  - [-0.230, -0.210]
  - [-0.230, 0.210]
