# Experimental effective-track candidate only.  It is a full schema-v2 copy
# so every runtime hashes one self-contained input.  Relative to the stable
# Jackal profile, only kinematics_profile_id, lifecycle, and
# effective_track_width differ.  The value rounds the clean contact-matrix
# Warehouse corr=0.025/offset=0.0004 mean 0.989336019045897 m; it is not a
# calibrated or accepted value, and this v1 file must never be edited in place.
